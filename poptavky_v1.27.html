}
function zavriAkce(){ $('#md-zavoj')?.classList.add('hidden'); const pn = $('#md-panel'); if (pn) { pn.classList.add('hidden'); pn.style.transform = ''; pn.classList.remove('tahne'); } }
/* v1.22: panel „Další akce“ se zavře i posunutím dolů (nalezeno uživatelem v provozu – šlo jen klepnout na pozadí).
   Táhne se za celý panel, když je odrolovaný nahoru; ne při psaní do pole. Krátké potáhnutí se vrátí zpět. */
(function(){
  const pn = $('#md-panel'); if (!pn) return;
  let y0 = null, dy = 0;
  pn.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, {passive: true});
  pn.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const d = e.touches[0].clientY - y0;
    if (d <= 0 || pn.scrollTop > 0) { if (dy) { dy = 0; pn.style.transform = ''; } return; }   // nahoru nebo ještě se rolují akce
    dy = d; pn.classList.add('tahne'); pn.style.transform = `translateY(${dy}px)`;
    if (e.cancelable) e.preventDefault();   // ať se při tažení nehýbe stránka pod panelem
  }, {passive: false});
  const konec = () => {
    if (y0 === null) return;
    const zavrit = dy > 70 || dy > pn.offsetHeight * .25;
    y0 = null; pn.classList.remove('tahne');
    if (zavrit) zavriAkce(); else pn.style.transform = '';
    dy = 0;
  };
  pn.addEventListener('touchend', konec); pn.addEventListener('touchcancel', konec);
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') zavriAkce(); });
MOBIL.addEventListener('change', () => { zavriAkce(); if (view === 'detail' && !psani()) renderDetail(curId); else if (view === 'home' && !psani()) renderHome(); });   // otočení telefonu, změna okna

/* ===== Známý zákazník (v1.2) =====
   Převzato z experimentu v0.5 ověřeného v emulátoru (repo Fenclotéka, experimenty/zakaznik_poptavka_v0.5).
   Rozhodnutí: zákazníka hledat automaticky, poptávku k němu přiřadit jen po klepnutí na Vybrat. Telefon nebo e-mail
   může mít víc lidí. Při nepotvrzené možné shodě se poptávka uloží bez zákazníka a nový zákazník nevznikne.
   „Je to nový zákazník“ založí nového i při podobném jménu nebo stejném telefonu – jen proti zákazníkům, které prodejce viděl.
   Vazba je jednosměrná: poptávka.zakaznik → /zakaznici/{key}. Starší poptávky zůstávají bez zákazníka. */
const TEL_RE = /^[0-9 +()\/-]+$/;              // stejné omezení jako pravidla /zakaznici/telefon
const EMAIL_RE = /^[^@ ]+@[^@ ]+\.[^@ ]+$/;    // stejné omezení jako pravidla /zakaznici/email

/* Normalizace – podmnožina matching.js z Fenclotéky (telefon bez předvolby +420, e-mail malými písmeny) */
const Norm = {
  phone(v){ return (v||'').toString().replace(/[\s\-().\/]/g,'').replace(/^00/,'+').replace(/^\+?420/,''); },
  phoneValid(v){ const s = this.phone(v); return (s && s.replace(/\D/g,'').length >= 6) ? s : null; },
  emailValid(v){
    const s = (v||'').toString().trim().toLowerCase().replace(/\s+/g,''), at = s.indexOf('@');
    if (at < 1 || s.indexOf('@', at + 1) !== -1) return null;
    const domain = s.slice(at + 1); return domain.indexOf('.') >= 1 ? s : null;
  }
};
/* Vyhledávací klíče; klíč v databázi nesmí obsahovat . # $ [ ] /, e-mail proto „.“ → „,“ */
function klicTelefonu(t){ const n = Norm.phoneValid(t); return n && /^\+?\d{6,15}$/.test(n) ? 'ph:' + n : null; }
function klicEmailu(e){ const n = Norm.emailValid(e); return n && !/[#$\[\]\/]/.test(n) ? 'em:' + n.replace(/\./g, ',') : null; }
function klicePro(telefon, email){
  const k = {}; const t = klicTelefonu(telefon), e = klicEmailu(email);
  if (t) k[t] = true; if (e) k[e] = true; return k;
}
/* Převzato z Fenclotéky (app.js, splitName): poslední slovo je příjmení */
function splitName(full){
  const parts = (full||'').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return {firstName:'', lastName:''};
  if (parts.length === 1) return {firstName:'', lastName:parts[0]};
  const lastName = parts.pop(); return {firstName:parts.join(' '), lastName};
}
/* Nový zákazník z údajů poptávky – jen pole, která pravidla povolí. Bez jména nebo bez platného telefonu/e-mailu → null. */
function zakaznikZPoptavky(v){
  const klice = klicePro(v.telefon, v.email), {firstName, lastName} = splitName(v.jmeno);
  const z = {zdroj:'poptavka', vytvoreno:TS(), upraveno:TS(), upravil:user.uid, klice};
  if (firstName && firstName.length <= 100) z.jmeno = firstName;
  if (lastName && lastName.length <= 100) z.prijmeni = lastName;
  if (!Object.keys(klice).length || (!z.jmeno && !z.prijmeni)) return null;
  if (v.telefon && v.telefon.length <= 30 && TEL_RE.test(v.telefon)) z.telefon = v.telefon;
  if (v.email && v.email.length <= 120 && EMAIL_RE.test(v.email)) z.email = v.email;
  return z;
}
/* Existující zákazník se shodným telefonem nebo e-mailem; krome = zákazníci, které prodejce viděl */
function najdiPodleKlicu(zakaznici, klice, krome = []){
  for (const [key, z] of Object.entries(zakaznici || {}))
    if (!krome.includes(key) && Object.keys(klice).some(k => z.klice && z.klice[k])) return key;
  return null;
}
function naKatalog(key, z){
  return {key, firstName:z.jmeno||'', lastName:z.prijmeni||'', company:z.firma||'', phone:z.telefon||'', email:z.email||''};
}
const celeJmeno = c => [c.firstName, c.lastName].filter(Boolean).join(' ') || c.company || '(bez jména)';

/* Vyhledání: telefon – shoda části čísla (aspoň 3 číslice); jméno – každé slovo bez diakritiky sedí na jméno, příjmení nebo firmu */
const bezDiakritiky = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function hledejZakaznika(jmeno, telefon){
  const qTel = Norm.phone(telefon || ''), telOk = qTel.replace(/\D/g,'').length >= 3;
  const slova = bezDiakritiky(jmeno).split(/\s+/).filter(Boolean), jmOk = slova.join('').length >= 3;
  const vysledky = [];
  for (const c of ZAKAZNICI) {
    const podleTel = telOk && Norm.phone(c.phone).includes(qTel);
    const pole = [c.firstName, c.lastName, c.company].map(bezDiakritiky);
    const podleJm = jmOk && slova.every(w => pole.some(x => x.includes(w)));
    if (podleTel || podleJm) vysledky.push({c, podleTel, podleJm});
  }
  vysledky.sort((a,b) => (b.podleTel - a.podleTel) || (a.c.lastName||'').localeCompare(b.c.lastName||'','cs'));
  return vysledky;
}

/* Poptávky zákazníka (dopočítané z /poptavky), nejnovější první */
function poptavkyZakaznika(key){
  return vsechny().filter(p => p.zakaznik === key).sort((a,b) => (b.vytvoreno||0) - (a.vytvoreno||0));
}
function radkyPoptavek(key){
  const p = poptavkyZakaznika(key);
  if (!p.length) return '<div class="sub">Poptávek: 0</div>';
  return `<div class="sub">Poptávek: ${p.length}</div><table>${p.map(x => `<tr><td>${esc(x.zajem || '(bez popisu)')}</td>
    <td class="d">${x.vytvoreno ? new Date(x.vytvoreno).toLocaleDateString('cs-CZ') : ''}</td></tr>`).join('')}</table>`;
}
function kartaZakaznika({c, podleTel}, akce){
  return `<div class="zak ${podleTel?'silna':''}">
    <div class="top"><span class="name">${esc(celeJmeno(c))}</span>
      <span class="badge ${podleTel?'b-tel':'b-jm'}">${podleTel?'shoda telefonu':'podobné jméno'}</span></div>
    <div class="sub">${esc([c.company, c.phone, c.email].filter(Boolean).join(' · '))}</div>
    ${radkyPoptavek(c.key)}
    <div class="row">${akce}</div>
  </div>`;
}

/* Panel pod telefonem ve formuláři nové poptávky */
function prekresli(){
  const box = $('#zakaznici'); if (!box) return;
  if (vybrany) {
    const c = ZAKAZNICI.find(z => z.key === vybrany);
    if (c) { box.innerHTML = `<div class="panel"><b>✔ Známý zákazník – údaje doplněny</b>
      ${kartaZakaznika({c, podleTel:true}, `<button class="btn sec sm" onclick="zrusVyber()">Není to on – zrušit výběr</button>`)}</div>`; return; }
    vybrany = null;
  }
  const jm = $('#f-jmeno').value, tel = $('#f-tel').value;
  const v = (jm.trim() || tel.trim()) ? hledejZakaznika(jm, tel) : [];
  if (novy && v.length && v.every(x => novy.includes(x.c.key))) {
    box.innerHTML = `<div class="panel"><b>✔ Nový zákazník – při uložení se založí</b>
      <div class="sub hint">Nikdo z podobných v evidenci (${v.length}) to není.</div>
      <div class="row"><button class="btn sec sm" onclick="zrusNovy()">Zrušit – ukázat podobné</button></div></div>`;
    return;
  }
  novy = null;                                          // vyhledávání ukazuje někoho dalšího → volbu potvrdit znovu
  if (!v.length) { box.innerHTML = ''; return; }        // nikdo podobný: formulář pokračuje jako ve v1.1
  const nadpis = v.length === 1 ? 'Známý zákazník?' : `Možní známí zákazníci (${v.length}) – vyber správného`;
  box.innerHTML = `<div class="panel"><b>${nadpis}</b>
    ${v.map(x => kartaZakaznika(x, `<button class="btn sm" data-k="${esc(x.c.key)}" onclick="vyber(this.dataset.k)">Vybrat</button>`)).join('')}
    <div class="row"><button class="btn sec sm" onclick="jeNovy()">Je to nový zákazník</button></div>
    <div class="hint" style="margin-top:8px">Když nevybereš nic, poptávka se uloží bez přiřazení k zákazníkovi.</div></div>`;
}
/* Výběr: jméno se nahradí celým jménem, telefon a e-mail se doplní jen do prázdných polí */
function vyber(key){
  const c = ZAKAZNICI.find(z => z.key === key); if (!c) return;
  vybrany = key; novy = null;
  $('#f-jmeno').value = celeJmeno(c);
  if (!$('#f-tel').value.trim() && c.phone) $('#f-tel').value = c.phone;
  if (!$('#f-mail').value.trim() && c.email) $('#f-mail').value = c.email;
  $('#f-err').textContent = '';
  prekresli();
}
function zrusVyber(){ vybrany = null; prekresli(); }
function jeNovy(){ novy = hledejZakaznika($('#f-jmeno').value, $('#f-tel').value).map(x => x.c.key); prekresli(); }
function zrusNovy(){ novy = null; prekresli(); }

/* Uložení nové poptávky jedním zápisem: poptávka (tvar v1.1 + zakaznik) a případně nový zákazník.
   Pořadí: 1) vybraný tlačítkem Vybrat, 1a) „Je to nový zákazník“ (jen proti viděným zákazníkům),
           2) možná shoda (stejný telefon/e-mail, nebo ji ukázalo vyhledávání) → BEZ zákazníka,
           3) žádná shoda → nový zákazník, 4) jinak bez zákazníka.
   Když /zakaznici nejde načíst, poptávka se uloží bez zákazníka jako ve v1.1. */
async function ulozPoptavku(v, pozn){
  const zakaznici = await db.ref('zakaznici').once('value').then(s => s.val() || {}, () => null);
  const upd = {}; let key = null, jak = 'bez';
  if (zakaznici) {
    const novyZ = zakaznikZPoptavky(v);
    if (vybrany && zakaznici[vybrany]) { key = vybrany; jak = 'vybrany'; }
    else {
      const shodaKlic = novyZ ? najdiPodleKlicu(zakaznici, novyZ.klice) : null;
      const nalezeni = hledejZakaznika(v.jmeno, v.telefon).map(x => x.c.key);
      if (novy && novyZ && nalezeni.every(k => novy.includes(k)) && !najdiPodleKlicu(zakaznici, novyZ.klice, novy))
        { key = db.ref('zakaznici').push().key; jak = 'novyPotvrzeny'; upd['zakaznici/' + key] = novyZ; }
      else if (novy) jak = novyZ ? 'neovereno' : 'bez';
      else if (shodaKlic || nalezeni.length) jak = 'neovereno';
      else if (novyZ) { key = db.ref('zakaznici').push().key; jak = 'novy'; upd['zakaznici/' + key] = novyZ; }
    }
  }
  const id = db.ref('poptavky').push().key;
  const zaznam = {...v, stav:'nova', vytvoreno: TS(), prodejce: user.email, historie: {}};
  if (key) zaznam.zakaznik = key;
  zaznam.historie[db.ref().push().key] = {t: TS(), kdo: user.email, text: 'Založeno (' + KANALY[v.kanal] + ')'};
  if (pozn) zaznam.historie[db.ref().push().key] = {t: TS(), kdo: user.email, text: pozn};
  upd['poptavky/' + id] = zaznam;
  await db.ref().update(upd);
  return {id, zakaznik: key, jak};
}

/* Detail poptávky: ke komu patří */
function zakaznikDetailu(p){
  if (!p.zakaznik) return '';
  const c = ZAKAZNICI.find(z => z.key === p.zakaznik); if (!c) return '';
  return `<div class="hint" style="margin-top:4px">👤 Zákazník: ${esc(celeJmeno(c))}${c.company ? ' (' + esc(c.company) + ')' : ''}</div>`;
}

/* ===== Kontakt do iPhonu (v1.4) =====
   Převzato z experimentu experimenty/vcard_v0.1 (ověřeno na skutečném iPhonu): vCard 3.0, UTF-8, řádky CRLF,
   escapování \ , ; a nových řádků, zalomení po 75 bajtech (nikdy uprostřed znaku). Jen ruční export po klepnutí,
   nic se nezapisuje do databáze ani do telefonu automaticky. iPhone skládá jméno z pole N, proto je označení i v příjmení. */
const vcEsc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
const utf8Len = s => new TextEncoder().encode(s).length;
function zalom(radek){
  const casti = []; let akt = '';
  for (const ch of radek) {
    if (utf8Len(akt + ch) > 75) { casti.push(akt); akt = ' ' + ch; }
    else akt += ch;
  }
  casti.push(akt);
  return casti.join('\r\n');
}
/* Telefon do mezinárodního tvaru: 777 123 456 / 00420… → +420 777 123 456; jiné (zahraniční) tvary beze změny */
function telefonCZ(t){
  const c = String(t || '').replace(/[^\d+]/g, '');
  if (/^\d{9}$/.test(c)) return '+420 ' + c.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  if (/^(\+|00)420\d{9}$/.test(c)) return '+420 ' + c.slice(-9).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  return String(t || '').trim();
}
/* vCard z poptávky: jméno (+ volitelné označení), telefon, e-mail, poznámka = celé „Co chce“ */
function vCardZPoptavky(p, znacka, id){
  const jmeno = String(p.jmeno || '').trim(), oz = String(znacka || '').trim();
  const zaklad = jmeno || telefonCZ(p.telefon) || String(p.email || '').trim() || 'Zákazník z Poptávek';
  const {firstName, lastName} = jmeno ? splitName(jmeno) : {firstName: '', lastName: zaklad};
  const prijmeni = [lastName, oz].filter(Boolean).join(' · ');
  const radky = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vcEsc(prijmeni)};${vcEsc(firstName)};;;`, `FN:${vcEsc([zaklad, oz].filter(Boolean).join(' · '))}`];
  if (String(p.telefon || '').trim()) radky.push(`TEL;TYPE=CELL,VOICE:${vcEsc(telefonCZ(p.telefon))}`);
  if (String(p.email || '').trim()) radky.push(`EMAIL;TYPE=INTERNET:${vcEsc(String(p.email).trim())}`);
  if (String(p.zajem || '').trim()) radky.push(`NOTE:${vcEsc(p.zajem)}`);
  if (id) radky.push(`item1.URL;TYPE=pref:${odkazNaPoptavku(id)}`, 'item1.X-ABLabel:Poptávky');   // v1.6: popisek „Poptávky“ v Kontaktech
  radky.push('END:VCARD');
  return {vcf: radky.map(zalom).join('\r\n') + '\r\n',
          soubor: (bezDiakritiky([zaklad, oz].filter(Boolean).join(' ')).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'kontakt') + '.vcf'};
}
/* ===== Odkaz z kontaktu v iPhonu (v1.6) – ověřeno experimentem vcard_odkaz_v0.1 =====
   Kontakt nese odkaz na stálou adresu poptavky.html (přesměruje na aktuální verzi), aby staré kontakty otevíraly
   vždy nejnovější Poptávky. Odkaz obsahuje jen ID poptávky; údaje se ukážou až po přihlášení. Adresa je odvozená
   od místa, odkud appka běží (větev při testování, main po sloučení). */
const odkazNaPoptavku = id => new URL('poptavky.html', location.href).href + '#poptavka=' + encodeURIComponent(id);
function idZOdkazu(){
  const m = location.hash.match(/^#poptavka=([^&]+)$/); if (!m) return null;
  try { return decodeURIComponent(m[1]); } catch (e) { return ''; }   // poškozený odkaz → hláška na přehledu
}
let cekaOdkaz = idZOdkazu(), dataNactena = false, hlaskaPrehled = '';
function otevriOdkaz(){
  const id = cekaOdkaz; cekaOdkaz = null;
  history.replaceState(null, '', location.pathname + location.search);   // obnovení stránky už detail znovu neotevře
  if (id && data[id]) { renderDetail(id); return; }
  hlaskaPrehled = 'Poptávku z kontaktu jsem nenašel – možná byla smazaná.';
  renderHome();
}
window.addEventListener('hashchange', () => { cekaOdkaz = idZOdkazu(); if (cekaOdkaz !== null && dataNactena) otevriOdkaz(); });

/* ===== Aktualizace za chodu (v1.10) =====
   Ikona na ploše iPhonu i záložka na PC si pamatují adresu konkrétní verze (poptavky.html na ni hned přesměruje).
   Proto si každá verze sama zjistí v poptavky.html, která je aktuální (AKTUALNI) a která nejstarší ještě smí běžet (MINIMALNI):
   - novější verze → lišta „Aktualizovat“ (nic nepřepne samo, prodejce může dopsat),
   - tahle verze je pod minimální (např. po změně tvaru dat) → lišta bez „Později“ a přepnutí, jakmile to nic nepřeruší:
     na přihlášení nebo na přehledu a mimo psaní do pole.
   Otevřená poptávka zůstane otevřená (předá se jako #poptavka=…, viz v1.6). Bez připojení se nic neděje. */
const VERZE = [1, 27];
const cisloVerze = soubor => { const m = /_v(\d+)\.(\d+)\.html/.exec(soubor || ''); return m ? [+m[1], +m[2]] : null; };
const novejsi = (a, b) => a[0] !== b[0] ? a[0] > b[0] : a[1] > b[1];     // 1.10 je novější než 1.9
let nabidnutaVerze = null, odlozenaVerze = null, nutnaVerze = null;
async function zkontrolujVerzi(){
  try {
    const r = await fetch(new URL('poptavky.html', location.href).href + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const t = await r.text(), akt = /AKTUALNI\s*=\s*'([^']+)'/.exec(t)?.[1], min = /MINIMALNI\s*=\s*'([^']+)'/.exec(t)?.[1];
    const va = cisloVerze(akt), vm = cisloVerze(min);
    if (!va || !novejsi(va, VERZE)) return;
    nabidnutaVerze = akt; nutnaVerze = vm && novejsi(vm, VERZE) ? akt : null;
    ukazListuVerze(va);
    prepniNaNutnou();
  } catch (e) { /* bez připojení nebo z lokálního souboru: zkusí se příště */ }
}
function ukazListuVerze(va){
  const l = $('#nova-verze'), nutna = !!nutnaVerze;
  if (!nutna && odlozenaVerze === nabidnutaVerze) return;
  l.className = 'nova-verze' + (nutna ? ' nutna' : '');
  l.innerHTML = nutna
    ? `<span>⚠ Tahle verze Poptávek už dosloužila – přepnu tě na v${va.join('.')}, jakmile dopíšeš.</span><button type="button" onclick="aktualizuj()">Aktualizovat</button>`
    : `<span>🎉 Je tu nová verze Poptávek (v${va.join('.')})</span><button type="button" onclick="aktualizuj()">Aktualizovat</button>`
      + `<button type="button" class="pozdeji" onclick="odlozenaVerze = nabidnutaVerze; skryjListuVerze()">Později</button>`;
  document.documentElement.style.setProperty('--lista', l.offsetHeight + 'px');
}
window.addEventListener('resize', () => { const l = $('#nova-verze'); if (!l.classList.contains('hidden')) document.documentElement.style.setProperty('--lista', l.offsetHeight + 'px'); });
function skryjListuVerze(){ $('#nova-verze').classList.add('hidden'); document.documentElement.style.setProperty('--lista', '0px'); }
function aktualizuj(){
  if (!nabidnutaVerze) return;
  const id = view === 'detail' && curId ? curId : null;
  location.replace(new URL(nabidnutaVerze, location.href).href + (id ? '#poptavka=' + encodeURIComponent(id) : ''));
}
function prepniNaNutnou(){
  if (nutnaVerze && !psani() && (!user || view === 'home')) aktualizuj();
}
zkontrolujVerzi();
setInterval(() => { if (document.visibilityState === 'visible') zkontrolujVerzi(); }, 30 * 60000);
setInterval(prepniNaNutnou, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') zkontrolujVerzi(); });

/* Po klepnutí: soubor .vcf ke stažení (na iPhonu otevřít a „Vytvořit nový kontakt“) */
function ulozKontakt(id){
  const p = data[id]; if (!p) return;
  const {vcf, soubor} = vCardZPoptavky(p, oznaceni.id === id ? oznaceni.text : '', id);
  const url = URL.createObjectURL(new Blob([vcf], {type: 'text/vcard;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = soubor; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}


/* ===== v1.20: dohody z porady, Můj týden, Porada =====
   Dohoda = jedna věta, kterou vedoucí napíše k obchodu (/poptavky/{id}/dohody/{id}): text, do (YYYY-MM-DD), vyjde
   ('' | 'uzavřít jako ztracený' | 'vrátit na poradu'), zadal, t, stav (otevrena | hotovo | potvrzena | dopracovat | preneseno), tip.
   Prodejce jen klepne „Hotovo“, vedoucí v pondělí potvrdí nebo vrátí k dopracování. Bez slova „nesplněno“, bez pořadí prodejců.
   Čas klepnutí „Hotovo“ se neukládá ani neukazuje. Role vedoucího = /uzivatele/{uid}/vedouci: true (nastavuje správce v konzoli). */
const AUTO_ZAPIS = /^(Založeno|Stav →|📄|🤝|✓ Hotovo)/;
const dohodyP = p => Object.entries(p.dohody || {}).map(([k, d]) => ({k, ...d})).filter(d => d && d.text).sort((a, b) => (b.t || 0) - (a.t || 0));
const aktivniDohoda = p => dohodyP(p).find(d => ['otevrena', 'hotovo', 'dopracovat'].includes(d.stav)) || null;
const krat = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+d}. ${+m}.`; };
function kontakty(p){   // počet zápisů „kontakt“ v historii (bez automatických řádků), celkem a za 14 dní
  const h = Object.values(p.historie || {}).filter(x => x && x.text && !AUTO_ZAPIS.test(x.text));
  const hranice = Date.now() - 14 * 86400000;
  return {celkem: h.length, ctrnact: h.filter(x => (x.t || 0) >= hranice).length, posledni: h.length ? Math.max(...h.map(x => x.t || 0)) : (p.vytvoreno || 0)};
}
const dnuOd = ts => Math.floor((Date.now() - ts) / 86400000);
function jmenoProdejce(e){ if (!e) return '(bez prodejce)'; return e.split('@')[0].split(/[._]/).map(cap).join(' '); }
function flagy(p){
  if (!OTEVRENE.includes(p.stav)) return [];
  const f = [], k = kontakty(p), n = posledniNabidka(p), t = dnes();
  if (dnuOd(k.posledni) >= 14) f.push(p.duvodTicha && p.duvodTicha.text ? ['důvod: ' + p.duvodTicha.text, 'ok'] : ['bez kontaktu ' + dnuOd(k.posledni) + ' dní', '']);
  if (p.dalsiKontakt && p.dalsiKontakt < t) f.push(['prošlý termín kontaktu', '']);
  if (!n && ['nova', 'jednani'].includes(p.stav) && dnuOd(p.vytvoreno || Date.now()) >= 7) f.push(['týden řešení a není nabídka', '']);
  if (n && n.interni && n.interni.negativni) f.push(['pod nákupní cenou', 'bad']);
  else if (n && n.interni && n.interni.nestandardni) f.push(['nízká marže', '']);
  return f;
}
const flagyHtml = p => flagy(p).length ? `<div class="fl-r">${flagy(p).map(([t, c]) => `<span class="fl ${c}">${esc(t)}</span>`).join('')}</div>` : '';
function dohodaRadek(p){
  const d = aktivniDohoda(p); if (!d || !OTEVRENE.includes(p.stav)) return '';
  const hotovo = d.stav === 'hotovo';
  return `<div class="dh-radek"><span class="dh-t ${hotovo ? 'cekam' : d.stav === 'dopracovat' ? 'dop' : ''}" title="${esc(d.text)}">🤝 ${esc(d.text)}${d.do ? ' · do ' + krat(d.do) : ''}</span>${
    hotovo ? '<span class="dh-t cekam">čeká na potvrzení</span>' : `<button type="button" class="mini" onclick="event.stopPropagation(); dohodaHotovo('${p.id}','${d.k}')">✓ Hotovo</button>`}</div>`;
}
function dohodaHotovo(id, k){
  const d = (data[id].dohody || {})[k]; if (!d) return;
  db.ref(`poptavky/${id}/dohody/${k}`).update({stav: 'hotovo'});
  log(id, '✓ Hotovo: ' + d.text);
}
function dalsiPondeli(){ const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return dnes(Math.round((d - new Date(new Date().toDateString())) / 86400000)); }
function terminy(){
  const dd = n => dnes(n), kon = (() => { const d = new Date(); return dnes(Math.round((new Date(d.getFullYear(), d.getMonth() + 1, 0) - new Date(d.toDateString())) / 86400000)); })();
  const pa = (() => { const x = new Date(); return dnes((5 - x.getDay() + 7) % 7 || 7); })();
  return [['do příštího pondělí', dalsiPondeli()], ['do pátku', pa], ['za 14 dní', dd(14)], ['do konce měsíce', kon]];
}
const SABLONY = ['Zavolej mu a dej mu 1 % navíc.', 'Domluv zkušební jízdu.', 'Pošli upravenou nabídku.', 'Připrav kupní smlouvu.'];
let dohodaForm = null;   // id obchodu s otevřeným formulářem dohody
function dohodaFormular(id, ctx){
  return `<form onsubmit="return dohodaUloz(event,'${id}')" data-ctx="${ctx}">
    <label class="f" for="dh-t-${ctx}${id}" style="margin:0">Jednou větou: co má prodejce udělat?</label>
    <input id="dh-t-${ctx}${id}" required maxlength="140" placeholder="např. Zavolej mu a dej mu 1 % navíc." autocomplete="off">
    <div class="sab">${SABLONY.map(t => `<button type="button" class="mini" onclick="this.closest('form').querySelector('input').value=this.textContent">${esc(t)}</button>`).join('')}</div>
    <div class="rada"><select name="do" aria-label="Do kdy">${terminy().map(([t, d]) => `<option value="${d}">${t} (${krat(d)})</option>`).join('')}</select>
    <select name="vyjde" aria-label="Když to nevyjde"><option value="">Když to nevyjde: bez pokynu</option><option>uzavřít jako ztracený</option><option>vrátit na poradu</option></select></div>
    <div class="rada"><button class="mini pri" type="submit">Uložit dohodu</button><button class="mini" type="button" onclick="dohodaForm=null;prekresliAkt()">Zrušit</button></div></form>`;
}
function dohodaUloz(e, id){
  e.preventDefault(); const f = e.target;
  const d = {text: f.querySelector('input').value.trim(), do: f.querySelector('[name=do]').value, vyjde: f.querySelector('[name=vyjde]').value, zadal: user.email, t: TS(), stav: 'otevrena'};
  if (!d.text) return false;
  db.ref(`poptavky/${id}/dohody`).push(d); log(id, '🤝 Dohoda: ' + d.text + (d.do ? ' (do ' + krat(d.do) + ')' : ''));
  dohodaForm = null; poForm = null; return false;
}
function dohodaVerdikt(id, k, v){
  const d = (data[id].dohody || {})[k]; if (!d) return;
  if (v === 'prenest') {
    db.ref(`poptavky/${id}/dohody/${k}`).update({stav: 'preneseno'});
    db.ref(`poptavky/${id}/dohody`).push({text: d.text, do: dalsiPondeli(), vyjde: d.vyjde || '', zadal: user.email, t: TS(), stav: 'otevrena'});
    log(id, '🤝 Dohoda přenesena na další týden: ' + d.text);
  } else {
    db.ref(`poptavky/${id}/dohody/${k}`).update({stav: v});
    log(id, v === 'potvrzena' ? '🤝 Dohoda dotažena: ' + d.text : '🤝 Dohoda k dopracování: ' + d.text);
  }
}
function dohodaTip(id, k, v){ db.ref(`poptavky/${id}/dohody/${k}/tip`).set(v.trim() || null); }
function prekresliAkt(){ if (view === 'detail') renderDetail(curId); else if (view === 'porada') renderPorada(true); else if (view === 'tyden') renderTyden(true); }
function dohodaBlok(id, p, mobil){
  const d = aktivniDohoda(p), stare = dohodyP(p).filter(x => x !== d);
  if (!d && !jeVedouci) return '';
  const cls = mobil ? 'md-karta-lite' : 'box';
  let h = `<div class="${cls} dh-box"><h3>Dohoda s vedoucím</h3>`;
  if (d) {
    h += `<div class="tipsef"><span class="kdo">Tip od šéfa</span>${esc(d.text)}<small>${d.do ? 'do ' + krat(d.do) : ''}${d.vyjde ? ' · když to nevyjde: ' + esc(d.vyjde) : ''}${d.tip ? ' · 💡 ' + esc(d.tip) : ''}</small></div>`;
    if (d.stav === 'hotovo') h += `<p class="hint" style="margin:8px 0 0">Hotovo 🎉 Vedoucí to uvidí na poradě.${jeVedouci ? '' : ''}</p>`;
    else h += `<div class="rada" style="margin-top:8px"><button class="mini pri" type="button" onclick="dohodaHotovo('${id}','${d.k}')">✓ Hotovo</button></div>`;
    if (jeVedouci) h += `<div class="rada" style="margin-top:8px"><button class="mini" type="button" onclick="dohodaVerdikt('${id}','${d.k}','potvrzena')">Potvrdit ✓</button><button class="mini" type="button" onclick="dohodaVerdikt('${id}','${d.k}','dopracovat')">Dopracovat</button><button class="mini" type="button" onclick="dohodaVerdikt('${id}','${d.k}','prenest')">↻ Na další týden</button></div>`;
    if (jeVedouci && d.stav === 'dopracovat') h += `<form onsubmit="return false"><input placeholder="Tip na příště (nepovinné)" maxlength="120" value="${esc(d.tip || '')}" onchange="dohodaTip('${id}','${d.k}',this.value)" aria-label="Tip na příště"></form>`;
  } else h += '<p class="hint" style="margin:0">Zatím bez dohody.</p>';
  if (jeVedouci) h += dohodaForm === id ? dohodaFormular(id, mobil ? 'm' : 'p') : `<div class="rada" style="margin-top:8px"><button class="mini" type="button" onclick="dohodaForm='${id}';prekresliAkt()">${d ? '+ Další krok' : '+ Dohoda'}</button></div>`;
  if (stare.length) h += `<details class="stare"><summary>Dřívější dohody (${stare.length})</summary>${stare.map(x => `<div>${x.stav === 'potvrzena' ? '✓' : x.stav === 'dopracovat' ? '↻' : x.stav === 'preneseno' ? '→' : '…'} ${esc(x.text)}${x.do ? ' <i>(do ' + krat(x.do) + ')</i>' : ''}</div>`).join('')}</details>`;
  return h + '</div>';
}

/* --- Můj týden: co na mě šéf uvidí (prodejce si připraví obchody před poradou) --- */
function mojeObchody(){ return vsechny().filter(p => p.prodejce === user.email && OTEVRENE.includes(p.stav)); }
let duvodForm = null;
function duvodUloz(e, id){ e.preventDefault(); const t = e.target.querySelector('input').value.trim();
  if (t) { db.ref('poptavky/' + id + '/duvodTicha').set({text: t.slice(0, 80), kdo: user.email}); } duvodForm = null; return false; }
function renderTyden(zPop){
  if (!zPop) stavHistorie('tyden', null);
  view = 'tyden'; curId = null; $('#fab').classList.add('hidden'); zavriAkce();
  const m = mojeObchody(), t = dnes();
  const dohody = m.map(p => [p, aktivniDohoda(p)]).filter(x => x[1]);
  const zv = m.filter(p => flagy(p).length).sort((a, b) => kontakty(b).posledni * -1 - kontakty(a).posledni * -1);
  const kartaT = p => { const k = kontakty(p), n = posledniNabidka(p);
    return `<div class="card" onclick="renderDetail('${p.id}')"><div class="top"><span class="name">${esc(p.jmeno || p.telefon || p.email || '(bez jména)')}</span><span class="badge b-${p.stav}">${STAVY[p.stav]}</span></div>
      ${vuzTxt(p) ? `<div class="sub">🚗 ${esc(vuzTxt(p))}</div>` : ''}${n ? `<div class="nab-radek" style="margin-top:3px">📄 ${esc(n.model || 'Nabídka')} · <b>${esc(kcK(n.cena_sdph || 0))}</b></div>` : ''}
      <div class="sub">kontaktů celkem ${k.celkem} · za 14 dní ${k.ctrnact} · poslední před ${dnuOd(k.posledni)} dny</div>${flagyHtml(p)}${dohodaRadek(p)}
      ${flagy(p).some(f => f[0].startsWith('bez kontaktu')) && !(p.duvodTicha && p.duvodTicha.text) ? (duvodForm === p.id
        ? `<form onsubmit="return duvodUloz(event,'${p.id}')" onclick="event.stopPropagation()" style="display:flex;gap:6px;margin-top:6px"><input required maxlength="80" placeholder="Co se děje? např. na dovolené do 9. 11." aria-label="Co se u zákazníka děje" style="flex:1;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px"><button class="mini pri" type="submit">Uložit</button></form>`
        : `<button type="button" class="mini" style="margin-top:6px" onclick="event.stopPropagation(); duvodForm='${p.id}'; renderTyden(true)">Zapsat, co se děje</button>`) : ''}</div>`; };
  $('#view').innerHTML = `<div class="row zpet" style="margin-top:0"><button class="btn sec sm" style="flex:0;white-space:nowrap" onclick="zpetNaPrehled()">← Přehled</button></div>
    <h2 style="margin-top:6px">Můj týden: co na mě šéf uvidí</h2>
    <p class="hint">Připrav si obchody před pondělní poradou. Nikomu se tím nic neposílá, je to jen pohled.</p>
    <div class="tyden-sekce"><h2>🤝 Dohody s vedoucím (${dohody.length})</h2>${dohody.length ? dohody.map(([p, d]) => `<div style="padding:6px 0;border-top:1px solid var(--line)"><b>${esc(p.jmeno || '(bez jména)')}</b><br>${esc(d.text)} <span class="hint">${d.do ? '· do ' + krat(d.do) : ''}</span> ${d.stav === 'hotovo' ? '<span class="hint">· čeká na potvrzení</span>' : `<button class="mini pri" onclick="dohodaHotovo('${p.id}','${d.k}')">✓ Hotovo</button>`}</div>`).join('') : '<p class="hint">Zatím žádné. Až si něco domluvíte, objeví se to tady i u obchodu.</p>'}</div>
    <div class="tyden-sekce"><h2>Obchody, které stojí za rozbor (${zv.length})</h2>${zv.length ? zv.map(kartaT).join('') : '<p class="hint">Nic nehoří. Dobrá zpráva do pondělí 🙂</p>'}</div>
    <div class="tyden-sekce"><h2>Ostatní otevřené (${m.length - zv.length})</h2>${m.filter(p => !flagy(p).length).map(kartaT).join('') || '<p class="hint">—</p>'}</div>`;
}

/* --- Porada (jen vedoucí, PC) --- */
let poVybr = null, poRazeni = 'ticho', poJenRozb = true, poZisk = false, poForm = null;
function renderPorada(zPop){
  if (!jeVedouci) { renderHome(); return; }
  if (!zPop) stavHistorie('porada', null);
  view = 'porada'; curId = null; $('#fab').classList.add('hidden'); zavriAkce();
  const vse = vsechny().filter(p => OTEVRENE.includes(p.stav)), lide = [...new Set(vse.map(p => p.prodejce || ''))].sort((a, b) => jmenoProdejce(a).localeCompare(jmenoProdejce(b), 'cs'));
  const vsechnyDohody = vsechny().flatMap(p => dohodyP(p).map(d => ({p, d})));
  const minule = vsechnyDohody.filter(x => ['hotovo', 'otevrena', 'dopracovat'].includes(x.d.stav));
  const sk = lide.map(e => [e, minule.filter(x => (x.p.prodejce || '') === e)]).filter(g => g[1].length);
  const dot = vsechnyDohody.filter(x => x.d.stav === 'potvrzena').length, vse2 = vsechnyDohody.length;
  const tym = lide.map(e => { const o = vse.filter(p => (p.prodejce || '') === e), rz = o.filter(p => flagy(p).length).length,
      hod = o.reduce((a, p) => a + ((posledniNabidka(p) || {}).cena_sdph || 0), 0), tichoMax = Math.max(0, ...o.map(p => dnuOd(kontakty(p).posledni)));
    const c = k => o.filter(p => p.stav === k).length;
    return `<button type="button" class="po-os" aria-pressed="${poVybr === e}" onclick="poVybr = poVybr === '${esc(e)}' ? null : '${esc(e)}'; renderPorada(true)">
      <b>${esc(jmenoProdejce(e))}</b><span class="vel">${o.length} <span style="font-size:14px;font-weight:400;color:var(--muted)">otevřených</span></span>
      <span class="hint">nové ${c('nova')} · nabídka ${c('nabidka')} · jednáme ${c('jednani')}</span>
      <span class="hint">nabídky za ${esc(kcK(hod))} · nejdelší ticho ${tichoMax} dní</span>
      <span class="rz ${rz ? '' : 'nic'}">${rz ? rz + ' k probrání' : '✓ nic nehoří'}</span></button>`; }).join('');
  let L = vse.filter(p => poVybr === null || (p.prodejce || '') === poVybr);
  if (poJenRozb) L = L.filter(p => flagy(p).length);
  const klic = {ticho: p => -kontakty(p).posledni * -1, hodnota: p => -((posledniNabidka(p) || {}).cena_sdph || 0), resi: p => (p.vytvoreno || 0), marze: p => { const n = posledniNabidka(p); return n && n.interni ? (n.interni.skutecna_marze ?? n.interni.obchodni_marze ?? 99) : 99; }}[poRazeni];
  L.sort((a, b) => klic(a) - klic(b));
  const radek = p => { const k = kontakty(p), n = posledniNabidka(p), d = aktivniDohoda(p), pz = posledniPoznamka(p);
    const zisk = n && n.interni ? (poZisk ? `${esc(kc(ziskNabidky(n)))}<span class="m">marže ${esc(pctCz(n.interni.skutecna_marze ?? n.interni.obchodni_marze))}</span>` : '<span class="muted">••• Kč</span>') : '<span class="m">–</span>';
    return `<tr><td><a href="#" onclick="renderDetail('${p.id}');return false" style="color:inherit;font-weight:700;text-decoration:none">${esc(p.jmeno || p.telefon || '(bez jména)')}</a>${vuzTxt(p) ? `<span class="m">🚗 ${esc(vuzTxt(p))}</span>` : ''}${flagyHtml(p)}</td>
      ${poVybr === null ? `<td>${esc(jmenoProdejce(p.prodejce))}</td>` : ''}<td><span class="badge b-${p.stav}">${STAVY[p.stav]}</span></td>
      <td>${n ? `<b>${esc(kcK(n.cena_sdph || 0))}</b><span class="m">${esc(n.model || '')} · sleva ${esc(pctCz(n.sleva_pct || 0))}</span>` : '<span class="m">bez nabídky</span>'}</td><td>${zisk}</td>
      <td>${Math.max(0, dnuOd(p.vytvoreno || Date.now()))} dní</td>
      <td><span class="${dnuOd(k.posledni) >= 14 ? 'dl' : ''}">před ${dnuOd(k.posledni)} dny</span>${pz ? `<span class="m">💬 ${esc(pz.text.slice(0, 70))}</span>` : ''}<span class="m">kontaktů celkem ${k.celkem} · za 14 dní ${k.ctrnact}</span></td>
      <td>${kdyKontakt(p) || '–'}</td>
      <td>${d ? `<span class="dh-t ${d.stav === 'hotovo' ? 'cekam' : ''}">🤝 ${esc(d.text)}</span>${d.stav === 'hotovo' ? '<span class="m">čeká na potvrzení</span>' : ''}` : '<span class="m">bez dohody</span>'}
        ${poForm === p.id ? dohodaFormular(p.id, 'po') : `<div style="margin-top:4px"><button type="button" class="mini" onclick="poForm='${p.id}';dohodaForm='${p.id}';renderPorada(true)">${d ? '+ Další krok' : '+ Dohoda'}</button></div>`}</td></tr>`; };
  $('#view').innerHTML = `<div class="po-wide"></div><div class="row zpet" style="margin-top:0"><button class="btn sec sm" style="flex:0;white-space:nowrap" onclick="zpetNaPrehled()">← Všechny poptávky</button></div>
    <h2 style="margin-top:6px;font-size:20px">Pondělní porada</h2>
    <div class="tyden-sekce"><h2>Začněte tady: co jste si řekli minule${vse2 ? ` · dotaženo ${dot} z ${vse2}` : ''}</h2>${sk.length ? sk.map(([e, arr]) => `<h3 style="margin:8px 0 4px;font-size:14px">${esc(jmenoProdejce(e))}</h3>` + arr.map(({p, d}) => `<div class="po-min"><span><b>${esc(p.jmeno || '(bez jména)')}</b><small>${esc((vuzTxt(p) || '').split(' · ')[0])}</small></span>
      <span>${esc(d.text)}<small>${d.do ? 'do ' + krat(d.do) : ''}${d.vyjde ? ' · když to nevyjde: ' + esc(d.vyjde) : ''}</small></span>
      <span class="ak">${d.stav === 'hotovo' ? '<span class="dh-t cekam">prodejce hlásí hotovo</span>' : ''}<button class="mini ${d.stav === 'hotovo' ? 'pri' : ''}" onclick="dohodaVerdikt('${p.id}','${d.k}','potvrzena')">Potvrdit ✓</button> <button class="mini" onclick="dohodaVerdikt('${p.id}','${d.k}','dopracovat')">Dopracovat</button> <button class="mini" onclick="dohodaVerdikt('${p.id}','${d.k}','prenest')">↻ Na další týden</button></span>
      ${d.stav === 'dopracovat' ? `<span class="tip"><input placeholder="Tip na příště (nepovinné)" maxlength="120" value="${esc(d.tip || '')}" onchange="dohodaTip('${p.id}','${d.k}',this.value)" aria-label="Tip na příště"></span>` : ''}</div>`).join('')).join('') : '<p class="hint">Zatím žádné otevřené dohody. Domluvte první u obchodu níže.</p>'}</div>
    <div class="po-tym">${tym}</div>
    <div class="po-nastroje"><label>Řadit <select onchange="poRazeni=this.value;renderPorada(true)">${[['ticho', 'nejdéle bez kontaktu'], ['hodnota', 'nejvyšší hodnota nabídky'], ['resi', 'nejdéle řeším'], ['marze', 'nejnižší marže']].map(([k, t]) => `<option value="${k}" ${poRazeni === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label><input type="checkbox" ${poJenRozb ? 'checked' : ''} onchange="poJenRozb=this.checked;renderPorada(true)"> jen to, co stojí za rozbor</label>
      <button class="btn sec sm" onclick="poZisk=!poZisk;renderPorada(true)">${poZisk ? '🙈 Schovat zisk' : '👁 Ukázat zisk'}</button><span class="hint">${L.length} obchodů</span></div>
    <div style="overflow-x:auto"><table class="po-tab"><thead><tr><th>Zákazník a vůz</th>${poVybr === null ? '<th>Prodejce</th>' : ''}<th>Stav</th><th>Nabídka</th><th>Zisk</th><th>Řeším</th><th>Kontakt zákazníka</th><th>Další kontakt</th><th>Dohoda</th></tr></thead>
      <tbody>${L.map(radek).join('') || '<tr><td colspan="9" class="hint" style="padding:20px">Nic k rozebrání. Dobrá zpráva do pondělí 🙂</td></tr>'}</tbody></table></div>
    <p class="hint" style="margin-top:10px">Označují se obchody, ne lidé. Prodejci nejsou nijak řazeni. Zisk je schovaný do klepnutí.</p>`;
}

/* ===== Export ===== */
function exportCSV(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
  const rows = [['Vytvořeno','Kanál','Jméno','Telefon','E-mail','Co chce','Vůz','Stav','Další kontakt','Prodejce']];
  vsechny().sort((a,b) => (a.vytvoreno||0) - (b.vytvoreno||0)).forEach(p => rows.push([
    fmtTs(p.vytvoreno), (KANALY[p.kanal]||'').replace(/^\S+\s/,''), p.jmeno, p.telefon, p.email, p.zajem, vuzTxt(p), STAVY[p.stav], fmtD(p.dalsiKontakt), p.prodejce]));
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'poptavky_' + dnes() + '.csv'; a.click();
}
</script>
