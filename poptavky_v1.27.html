     v1.8: prázdné „Dnes zavolat“ nabídne až 3 tipy, komu zavolat – „Dlouho ticho“ (otevřená poptávka 14+ dní bez zápisu)

     v1.9: „Souhlas GDPR“ v detailu – připraví SMS s odkazem na formulář souhlasu MB; odešle prodejce sám,

     v1.10: aktualizace za chodu – appka se při spuštění, návratu do popředí a každých 30 min podívá do poptavky.html;
           novější verze → lišta „Aktualizovat“, pod minimální verzí → přepnutí, jakmile to nic nepřeruší
     v1.11: „🎉 Tento měsíc prodáno: 3 auta ≈ … Kč“ a výhled z rozjednaných – jen moje poptávky, průměrná provize

     v1.12: manifest.json – všechny verze ve složce patří k appce na ploše (aktualizace bez lišty prohlížeče)
           a ikona se spouští ze stálé adresy poptavky.html (vždy nejnovější verze)
     v1.13: „📄 Udělat nabídku“ v detailu na PC – otevře Mercedes Offer Studio (127.0.0.1:8774) s vyplněným
           zákazníkem a ID poptávky; je to jen odkaz, nic se nezapisuje, stav se nemění
     v1.14: nabídky z Offer Studia (od v1.5.0) v detailu na PC – model, cena, sleva a zisk (schovaný do klepnutí);
           v hlavičce na PC „Zisk z prodaných aut“ tento měsíc; jen čtení, Poptávky nic nepočítají ani nezapisují
     v1.27: úpravy podle zkoušky v1.26 – výchozí řazení podle fáze (Nová, Jednáme, Nabídka odeslána; uvnitř podle dalšího kontaktu) s nadpisy skupin;
            kratší filtr prodejce hned vedle Otevřené/Prodáno/Ztraceno/Vše; „Cena vozu“ jen když se liší od „Celkem s DPH“; dlouhý název souboru se zkrátí
     v1.26: přehlednější přehled (návrh z ChatGPT upravený podle pravidel appky): na PC od 1200 px jeden řádek na poptávku se sloupci Zákazník | Řeší / vůz | Poslední zápis | Nabídka | Sleva | Zisk | Stav | Další kontakt;
            „poslední zápis“ je poslední skutečná poznámka (bez automatických řádků „Nabídka připravena“, „Stav →“); vlastník poptávky se ukazuje jen u cizích poptávek;
            karty v „Dnes zavolat“ jsou kratší (jméno, co chce, poslední poznámka; termín jen když je prošlý)
     v1.25: vedoucí vidí u poptávky jejího prodejce (karta, mobilní detail) a v přehledu může filtrovat podle prodejce (Všichni / jméno + počet otevřených)
     v1.24: víc prodejců – každý prodejce načítá a vidí jen své poptávky (dotaz podle prodejce), vedoucí vidí všechny; nová pravidla databáze (firebase/database.rules.json)
     v1.23: oprava – v1.22 měla v kódu staré číslo verze (1.21), takže lišta „Aktualizovat“ nabízela pořád stejnou verzi a klepnutí nic neudělalo
     v1.22: panel „Další akce“ na mobilu jde zavřít posunutím dolů (nejen klepnutím na pozadí)
     v1.21: víc hlášek v „Dnes zavolat“ (suchý a černý humor podle uživatele, nikdy na účet lidí)
     v1.20: dohody z porady (vedoucí napíše jednu větu, prodejce klepne „Hotovo“, vedoucí potvrdí nebo vrátí), „Můj týden“ pro prodejce a „Porada“ pro vedoucího
     v1.19: na PC je nad detailem pruh „← Všechny poptávky“ (výrazné modré tlačítko, přilepený při posouvání) a klávesa Esc vrací na přehled
     v1.18: tlačítko Zpět prohlížeče vrací z detailu na přehled; „← Zpět na přehled“ je výraznější; detail nabídky na PC ukazuje celou cenovou kalkulaci (zisk dál schovaný)
     v1.17: detail poptávky na PC je široký a ve dvou sloupcích (vlevo zákazník, nabídka a vůz, vpravo stav, další kontakt, zápis a historie); mobil beze změny
     v1.16: vůz u poptávky – původ (skladový / do výroby / od dealera), Auftrag nebo online kód, lokace (ručně, nepovinné)
     v1.15: ekonomika na přehledu – u každé poptávky nabídka (model · cena · sleva) a poslední zápis (i na mobilu);

<title>Poptávky v1.27</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111;--muted:#6b7280;--line:#e5e7eb;--acc:#0078d6;--red:#dc2626;--green:#16a34a;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.hidden{display:none!important}
header{background:#111;color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer;white-space:nowrap}
header small{color:#9ca3af;font-size:12px}
header button{background:none;border:1px solid #444;color:#ddd;border-radius:8px;padding:5px 9px;font-size:13px;flex-shrink:0}
/* v1.10: lišta s novou verzí – visí pod (přilepenou) hlavičkou, takže je vidět i při posouvání */
.nova-verze{position:absolute;left:0;right:0;top:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#e6f1fb;color:var(--ink);border-bottom:1px solid #bfdbfe;padding:8px 12px 8px 16px;font-size:14.5px;line-height:1.3}
.nova-verze span{flex:1 1 0;min-width:0}
header .nova-verze button{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
header .nova-verze button.pozdeji{background:none;color:var(--muted);font-weight:400;padding:8px 4px}
.nova-verze.nutna{background:#fef3c7;border-bottom-color:#fde68a}
#view{padding-top:calc(14px + var(--lista, 0px))}   /* obsah začíná pod lištou, nic nezakryje */
#who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 100px}
/* v1.17: detail na PC – široký, dva sloupce */
.pc-detail{display:block}
@media (min-width:960px){
  main:has(.pc-detail){max-width:1240px;padding-left:24px;padding-right:24px}
  .pc-detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 18px;align-items:start}
  .pc-detail .pc-konec{grid-column:1 / -1}
  .pc-detail .pc-lev,.pc-detail .pc-prav{min-width:0}
  .pc-detail .pc-prav{position:sticky;top:calc(14px + var(--lista, 0px))}
  .pc-detail .pc-lista{grid-column:1 / -1;position:sticky;top:calc(50px + var(--lista, 0px));z-index:4;display:flex;align-items:center;gap:16px;margin:0 -24px 12px;padding:10px 24px;background:#e8f2fc;border-bottom:1px solid #bcd9f5}
  .pc-detail .zpet-pc{flex:0 0 auto;white-space:nowrap;font-weight:700;padding:12px 24px;font-size:17px;border-radius:10px;box-shadow:0 1px 3px rgba(0,120,214,.35)}
  .pc-detail .pc-lista .drobek{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155;font-size:15px}
  .pc-detail .pc-lista .drobek .jm{color:var(--ink);font-weight:700}
  .pc-detail .pc-lista kbd{font:inherit;font-size:12px;border:1px solid #9ec5ea;border-radius:5px;padding:1px 6px;background:#fff;color:#334155}
  .pc-detail .pc-konec{display:flex;gap:8px;justify-content:flex-end}
  .pc-detail .pc-konec .btn{flex:0 0 auto;min-width:160px}
  .pc-detail .box h3.pc-nadpis{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-weight:600}
.skup{margin:14px 4px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tab-hlava + .skup{margin-top:6px}
.vl-radek{font-size:12px;font-weight:600;color:var(--muted)}
.fprodejce{margin-left:0;width:auto;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);max-width:100%}
.card .sub{color:var(--muted);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#e5e7eb;white-space:nowrap}
.b-nova{background:#dbeafe;color:#1e40af}.b-nabidka{background:#fef3c7;color:#92400e}.b-jednani{background:#ede9fe;color:#5b21b6}
.b-prodano{background:#dcfce7;color:#166534}.b-ztraceno{background:#f3f4f6;color:#6b7280}
.late{color:var(--red);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:14px}
.hec{color:var(--muted);font-size:14px;margin:-4px 0 8px}
.hec.late{color:var(--red)}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips input{display:none}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
#fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:16px}
.box{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.hist{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:14px}
.hist small{color:var(--muted);display:block}
/* v1.3: historie v detailu sbalená – klepnutím na nadpis rozbalit / sbalit */
.historie{margin-top:12px;border-top:1px solid var(--line)}
.historie summary{list-style:none;cursor:pointer;position:relative;min-height:44px;padding:10px 28px 8px 0;font-size:15px;font-weight:600}
.historie summary::-webkit-details-marker{display:none}
.historie summary::after{content:'▾';position:absolute;right:4px;top:10px;color:var(--muted);transition:transform .15s}
.historie[open] summary::after{transform:rotate(180deg)}
.kontakt input{flex:1 1 160px;min-width:0}
.kontakt .btn{flex:0 0 auto;white-space:nowrap}
/* v1.5: detail na mobilu (vykresluje se jen do 600 px) */
.md-karta{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.md-stavy{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.md-stavy .badge{font-size:12.5px;font-weight:600;padding:3px 10px}
.md-termin{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f9fafb;color:var(--muted);border:1px solid var(--line)}
.md-termin.dnes{background:#e6f1fb;color:var(--acc);border-color:transparent}
.md-termin.pozde{background:#fef2f2;color:var(--red);border-color:transparent}
.md-jmeno{font-size:24px;margin:8px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.md-meta{color:var(--muted);font-size:13px}
.md-label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.md-cochce{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16.5px}
.md-cochce.zkr{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.md-odkaz{background:none;border:0;padding:6px 0 0;color:var(--acc);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.md-kontakt{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:16px}
.md-kontakt.jeden{grid-template-columns:1fr}
.md-akce{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:58px;border-radius:12px;padding:8px 14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;min-width:0}
.md-akce b{font-size:16px}
.md-akce span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.md-akce.hlavni{background:var(--acc);border-color:var(--acc);color:#fff}
.md-akce.hlavni span{color:#dbeafe}
.md-nadpis{font-size:17px;margin:0 0 2px}
.md-pod{color:var(--muted);font-size:13px;margin:0 0 6px}
.md-zapsat{display:flex;justify-content:flex-end;margin-top:8px}
.md-zapsat .btn{border-radius:99px;min-height:44px;padding:11px 20px}
.md-zapsat .btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.md-oddel{height:1px;background:var(--line);margin:16px 0}
.md-datum{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.md-datum .md-label{margin:0}
.md-datum b{font-size:18px;text-align:right}
.md-datum b.pozde{color:var(--red)}
.md-chipy{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.md-chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;min-height:40px;font:inherit;font-size:15px;
  display:inline-flex;align-items:center;position:relative;cursor:pointer;color:var(--ink)}
.md-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.md-chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.md-seg{display:grid;grid-template-columns:1fr 1.65fr 1fr;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.md-seg button{border:0;background:none;border-radius:9px;min-height:42px;padding:4px 6px;font:inherit;font-size:14.5px;line-height:1.15;font-weight:600;color:var(--muted);text-wrap:balance;cursor:pointer}
.md-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.md-uzavrit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.md-uzavrit button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink)}
.md-uzavrit .prodano.on{background:#dcfce7;border-color:var(--green);color:var(--green)}
.md-uzavrit .ztraceno.on{background:var(--line);border-color:var(--muted)}
.md-hist{margin-top:0;border-top:0}
.md-vic{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:4;border-radius:99px;min-height:48px;padding:0 20px;
  font:inherit;font-size:16px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.md-zavoj{position:fixed;inset:0;background:rgba(17,17,17,.38);z-index:20}
.md-panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:85vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md-uchyt{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.md-panel.tahne{transition:none}.md-panel{transition:transform .18s ease-out;overscroll-behavior:contain}
.md-panel h3{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}
.md-vcf{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.md-vcf label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.md-r{display:flex;gap:8px;flex-wrap:wrap}
.md-r input{flex:1 1 150px;min-width:0}
.md-r .btn{border-radius:99px;min-height:44px;white-space:nowrap}
.md-radek{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);background:none;
  text-align:left;font:inherit;font-size:16px;padding:0 2px;cursor:pointer;color:var(--ink)}
.md-radek span{width:28px;text-align:center}
.md-radek.cervena{color:var(--red)}
.md-potvrd{background:#fef2f2;border-radius:12px;padding:12px;margin-top:8px}
.md-potvrd p{margin:0 0 10px;font-size:14.5px}
.md-r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.md-r2 .btn{border-radius:99px;min-height:44px}
.btn.md-smazat{background:var(--red)}
.historie .posledni{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--red);font-size:14px;margin-top:8px}
.tools{display:flex;gap:8px;margin-top:8px}
/* v1.2: známý zákazník */
.hint{color:var(--muted);font-size:13px}
.panel{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.panel b{font-size:14px}
#zakaznici:empty{display:none}
.zak{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere;background:#fff}
.zak.silna{border-color:#86efac;background:#f0fdf4}
.zak .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

  messagingSenderId: "602272019737",

/* ================================================================================== */

const STAVY = {nova:'Nová', nabidka:'Nabídka odeslána', jednani:'Jednáme', prodano:'Prodáno', ztraceno:'Ztraceno'};
const OTEVRENE = ['nova','nabidka','jednani'];
const VUZ_PUVOD = {sklad:'Skladový', vyroba:'Do výroby', dealer:'Od dealera'};
function vuzTxt(p){   // v1.16: „Skladový · 05-576-12345 · Karlovy Vary“ (nic, když vůz není vyplněný)
  const v = p.vuz; if (!v) return '';
  return [VUZ_PUVOD[v.puvod] || '', v.id || '', v.lokace || ''].filter(Boolean).join(' · ');
}
const KANALY = {showroom:'🏢 Showroom', telefon:'📞 Telefon', email:'✉️ E-mail'};
const TS = () => firebase.database.ServerValue.TIMESTAMP;

let data = {}, view = 'home', curId = null, filtr = 'otevrene', hledat = '', user = null, ref = null;
let ZAKAZNICI = [], zakRef = null, vybrany = null, novy = null, poUlozeni = null;   // v1.2: známý zákazník

const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s/g,'');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
function dnes(off = 0){ const d = new Date(); d.setDate(d.getDate() + off);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${+d}. ${+m}. ${y}`; }
function fmtTs(ts){ if(!ts) return ''; const d = new Date(ts);
  return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}); }
function kdyKontakt(p){ if(!p.dalsiKontakt || !OTEVRENE.includes(p.stav)) return '';
  const t = dnes(); const late = p.dalsiKontakt < t;
  return `<span class="${late?'late':''}">${p.dalsiKontakt===t?'dnes':fmtD(p.dalsiKontakt)}${late?' ⚠':''}</span>`; }
const psani = () => ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);

/* ===== Start + přihlášení ===== */
if (firebaseConfig.apiKey === 'DOPLNIT') {
  document.body.innerHTML = '<main><h2>Chybí nastavení Firebase</h2><p>Otevři soubor v editoru a doplň <b>firebaseConfig</b> nahoře ve skriptu.</p></main>';
  throw new Error('firebaseConfig není vyplněn');
}
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.database();

auth.onAuthStateChanged(u => {
  user = u;
  if (u) {
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    $('#who').textContent = u.email;
    jeVedouci = false; $('#b-tyden').classList.remove('hidden'); $('#b-porada').classList.add('hidden');
    // v1.24: poptávky se načítají až po zjištění role. Vedoucí čte všechny, prodejce jen dotazem na vlastní e-mail
    // (pravidla databáze čtení celého seznamu prodejci nedovolí). Když se role nepodaří zjistit, bere se jako prodejce.
    const nactiPoptavky = () => {
      if (!user || user.uid !== u.uid || ref) return;
      ref = jeVedouci ? db.ref('poptavky') : db.ref('poptavky').orderByChild('prodejce').equalTo(u.email);
      ref.on('value', s => {
        data = s.val() || {}; dataNactena = true;
        if (cekaOdkaz !== null) { otevriOdkaz(); return; }   // v1.6: přišel jsem z odkazu v kontaktu iPhonu
        if (view === 'home') renderHome();
        else if (view === 'detail' && !psani()) renderDetail(curId);
        else if (view === 'tyden' && !psani()) renderTyden(true);
        else if (view === 'porada' && !psani()) renderPorada(true);
      }, e => alert('Chyba databáze: ' + e.message));
    };
    db.ref('uzivatele/' + u.uid + '/vedouci').once('value').then(v => {   // v1.20: roli vedoucího nastavuje správce v konzoli Firebase (z aplikace zapsat nejde)
      jeVedouci = v.val() === true; $('#b-porada').classList.toggle('hidden', !jeVedouci);
      nactiPoptavky();
      if (view === 'home') renderHome(true); else if (view === 'detail' && !psani()) renderDetail(curId);
    }, () => nactiPoptavky());
    zakRef = db.ref('zakaznici');
    zakRef.on('value', s => {
      ZAKAZNICI = Object.entries(s.val() || {}).map(([key, z]) => naKatalog(key, z));
      if (view === 'form' && $('#zakaznici') && !psani()) prekresli();
    }, () => { ZAKAZNICI = []; });                     // bez zákazníků poptávky fungují jako ve v1.1
    renderHome();
  } else {
    if (ref) { ref.off(); ref = null; }
    data = {};
    if (zakRef) zakRef.off();
    dataNactena = false;
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  }
});

function prihlasit(){
  $('#l-err').textContent = '';
  auth.signInWithEmailAndPassword($('#l-mail').value.trim(), $('#l-pass').value)
    .catch(e => $('#l-err').textContent = 'Přihlášení se nepovedlo: ' + e.code);
}

/* ===== Přehled ===== */
function vsechny(){ return Object.entries(data).map(([id,p]) => ({id, ...p})); }

/* v1.25: vedoucí vidí vlastníka poptávky a může filtrovat podle prodejce (prodejce vidí jen své, nic z toho nepotřebuje) */
const FILTR_PRODEJCE_KLIC = 'poptavky.filtrProdejce';
const MOJE = '@moje';   // výchozí pro vedoucího (rozhodnutí uživatele): jen moje poptávky; '' = všichni prodejci, jinak e-mail prodejce
let filtrProdejce = MOJE; try { const u = localStorage.getItem(FILTR_PRODEJCE_KLIC); if (u !== null) filtrProdejce = u; } catch (e) {}
const vlastnik = p => jeVedouci && p.prodejce !== user.email ? `<div class="vl-radek">👤 ${esc(jmenoProdejce(p.prodejce))}</div>` : '';   // v1.26: u vlastních poptávek je jméno zbytečné
function vidiPoptavky(){ const f = filtrProdejce === MOJE ? user.email : filtrProdejce; return vsechny().filter(p => !jeVedouci || !f || (p.prodejce || '') === f); }
function nastavFiltrProdejce(v){ filtrProdejce = v; try { localStorage.setItem(FILTR_PRODEJCE_KLIC, v); } catch (e) {} renderHome(); }
function vyberProdejce(){
  if (!jeVedouci) return '';
  const vse = vsechny(), ostatni = [...new Set(vse.map(p => p.prodejce || ''))].filter(e => e !== user.email).sort((a, b) => jmenoProdejce(a).localeCompare(jmenoProdejce(b), 'cs'));
  if (dataNactena && filtrProdejce && filtrProdejce !== MOJE && !ostatni.includes(filtrProdejce)) filtrProdejce = MOJE;   // uložený prodejce už nemá žádnou poptávku (až po načtení dat, jinak by se filtr po obnovení stránky zahodil)
  const otevrene = e => vse.filter(p => (p.prodejce || '') === e && OTEVRENE.includes(p.stav)).length;
  const o = (v, txt) => `<option value="${esc(v)}" ${filtrProdejce === v ? 'selected' : ''}>${esc(txt)}</option>`;
  return `<select class="fprodejce" aria-label="Prodejce (počet otevřených)" title="Čí poptávky ukázat (v závorce počet otevřených)" onchange="nastavFiltrProdejce(this.value)">${o(MOJE, `👤 Moje (${otevrene(user.email)})`)}${o('', '👥 Všichni')}${
    ostatni.map(e => o(e, `${jmenoProdejce(e)} (${otevrene(e)})`)).join('')}</select>`;
}

function renderHome(zPop){
  const fokusProvize = provizeChciFokus || document.activeElement?.id === 'provize'; provizeChciFokus = false;   // v1.11: rozepsaná provize přežije překreslení
  if (!zPop && history.state && PODSTR.includes(history.state.v)) { ignorujPop = true; history.back(); }   // v1.18: zásobník historie zůstane čistý
  view = 'home'; curId = null; poUlozeni = null; historieOtevrena = null; historiePcZavrena = null; oznaceni = {id: null, text: ''}; celyText = null; zavriAkce(); $('#fab').classList.remove('hidden');
  const t = dnes();
  const volat = vidiPoptavky().filter(p => OTEVRENE.includes(p.stav) && p.dalsiKontakt && p.dalsiKontakt <= t)
                         .sort((a,b) => a.dalsiKontakt.localeCompare(b.dalsiKontakt));
  const chip = (k, txt) => `<span class="chip ${filtr===k?'on':''}" onclick="filtr='${k}';renderHome()">${txt}</span>`;
  const hlaska = hlaskaPrehled; hlaskaPrehled = '';
  $('#view').innerHTML = `${hlaska ? `<div class="err" style="margin:0 0 10px">${esc(hlaska)}</div>` : ''}<div class="dash">
    <section class="dnes">
      <h2>📞 Dnes zavolat (${volat.length})</h2>
      ${hecni(volat)}
      ${volat.map(p => karta(p, false, true)).join('')}
      ${volat.length ? '' : tipy()}
    </section>
    <section class="evidence">
      <div class="sekce-hlava"><h2>Poptávky</h2>${vydelek()}</div>
      <input id="hledat" placeholder="Hledat jméno, telefon, e-mail, model…" value="${esc(hledat)}" oninput="hledat=this.value;renderSeznam()">
      <div class="chips">${chip('otevrene','Otevřené')}${chip('prodano','Prodáno')}${chip('ztraceno','Ztraceno')}${chip('vse','Vše')}${vyberProdejce()}</div>
      <div id="seznam"></div>
      <div class="tools"><button class="btn sec sm" onclick="exportCSV()">⬇ Export do Excelu (CSV)</button></div>
    </section>
  </div>`;
  renderSeznam();
  if (provizeUprava !== null && fokusProvize) { const i = $('#provize'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/* ===== Výdělek z prodaných aut (v1.11) =====
   Slaví prodané: „🎉 Tento měsíc prodáno: 3 auta ≈ 24 000 Kč“ a ukáže realistický výhled z rozjednaných.
   - Jen poptávky přihlášeného prodejce (připraveno pro víc prodejců).
   - Prodáno tento měsíc = poslední „Stav → Prodáno“ v historii v tomto kalendářním měsíci (bez historie: čas úpravy).
   - Výhled = otevřené × moje úspěšnost × provize; úspěšnost = prodané / (prodané + ztracené), až od 5 uzavřených obchodů.
   - Průměrná provize jen v tomto zařízení (localStorage), ne ve sdílené databázi. Částky schované do klepnutí (showroom).
   - Na mobilu (do 600 px) jen jeden krátký řádek „🎉 3 auta tento měsíc ›“; klepnutí rozbalí celý blok s částkami, další sbalí. */
const PROVIZE_KLIC = 'poptavky.provize';
let vydelekMaZisk = false;   // v1.14: na PC je co odkrýt i bez provize
let vydelekOdkryt = false, vydelekRozbaleno = false, provizeUprava = null, provizeChciFokus = false;   // provizeUprava: rozepsaná částka, null = nezadává se
function provize(){ try { const v = +localStorage.getItem(PROVIZE_KLIC); return v > 0 ? v : null; } catch (e) { return null; } }
function datumProdeje(p){
  const t = Object.values(p.historie || {}).filter(h => /^Stav → Prodáno/.test(h.text || '')).map(h => h.t || 0);
  return t.length ? Math.max(...t) : (p.upraveno || 0);
}
const kc = n => Math.round(n).toLocaleString('cs-CZ') + ' Kč';
const aut = n => n === 1 ? 'auto' : n >= 2 && n <= 4 ? 'auta' : 'aut';
const obchodu = n => n === 1 ? 'obchod' : n >= 2 && n <= 4 ? 'obchody' : 'obchodů';
function vydelek(){
  if (!user || !dataNactena) return '';   // bez načtených dat by krátce problikla „0 aut“
  if (provizeUprava !== null) return `<div class="vydelek-uprava"><label for="provize">Průměrná provize za auto</label>
    <input id="provize" inputmode="numeric" autocomplete="off" placeholder="např. 8 000" value="${esc(provizeUprava)}"
      oninput="provizeUprava = this.value" onkeydown="if (event.key === 'Enter') ulozProvizi()">
    <button type="button" class="btn sm" onclick="ulozProvizi()">Uložit</button>
    <button type="button" class="btn sec sm" onclick="provizeUprava = null; renderHome()">Zrušit</button>
    <span class="hint">Uloží se jen v tomhle zařízení, nikdo jiný ji neuvidí.</span></div>`;
  const moje = vsechny().filter(p => p.prodejce === user.email), d = new Date(), od = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  const prodane = moje.filter(p => p.stav === 'prodano'), mesic = prodane.filter(p => datumProdeje(p) >= od).length;
  const ztracene = moje.filter(p => p.stav === 'ztraceno').length, otevrene = moje.filter(p => OTEVRENE.includes(p.stav)).length;
  const uzavrene = prodane.length + ztracene, uspesnost = uzavrene >= 5 ? prodane.length / uzavrene : null, prov = provize();
  if (MOBIL.matches && !vydelekRozbaleno)
    return `<button type="button" class="vydelek kratky" onclick="klikVydelek()">${mesic ? `🎉 <b>${mesic} ${aut(mesic)}</b> tento měsíc` : '🚗 Tento měsíc zatím 0 aut'} ›</button>`;
  const castka = n => vydelekOdkryt ? '≈ ' + kc(n) : '≈ ••• Kč';
  let r1 = mesic ? `🎉 Tento měsíc prodáno: <b>${mesic} ${aut(mesic)}</b>` : '🚗 Tento měsíc zatím 0 aut – první kus se chystá';
  if (mesic && prov) r1 += ` ${castka(mesic * prov)}`;
  let r2 = `Rozjednáno: ${otevrene} ${obchodu(otevrene)}`;
  if (otevrene && prov) r2 += uspesnost === null ? ' · výhled spočítám po 5 uzavřených obchodech' : ` · výhled ${castka(Math.round(otevrene * uspesnost * prov / 100) * 100)}`;
  if (!prov) r2 += ' · klepni a zadej provizi';
  // v1.14: zisk z prodaných aut tento měsíc – jen na PC, jen z nabídek z Offer Studia (poslední nabídka poptávky)
  const sZiskem = prodane.filter(p => datumProdeje(p) >= od).map(p => (nabidkySerazene(p)[0] || {}).interni).filter(Boolean);
  vydelekMaZisk = !MOBIL.matches && sZiskem.length > 0;
  if (vydelekMaZisk) r2 += `<span class="vyhled zisk-mesic">Zisk z prodaných aut: ${vydelekOdkryt ? '≈ ' + kc(sZiskem.reduce((s, i) => s + (i.skutecny_zisk != null ? i.skutecny_zisk : i.zisk), 0)) : '≈ ••• Kč'}${sZiskem.length < mesic ? ` (${sZiskem.length} z ${mesic} aut s nabídkou)` : ''}</span>`;
  else if (vydelekOdkryt) r2 += ` · <span class="md-odkaz" style="padding:0;font-size:13px" onclick="event.stopPropagation(); provizeUprava = String(provize()); provizeChciFokus = true; renderHome()">✏️ provize</span>`;
  return `<button type="button" class="vydelek" onclick="klikVydelek()">${r1}<span class="vyhled">${r2}</span></button>`;
}
function klikVydelek(){
  if (MOBIL.matches && !vydelekRozbaleno) vydelekRozbaleno = vydelekOdkryt = true;          // mobil: rozbalit rovnou s částkami
  else if (!provize() && !(vydelekMaZisk && !vydelekOdkryt)) { provizeUprava = ''; provizeChciFokus = true; }
  else if (MOBIL.matches) vydelekRozbaleno = vydelekOdkryt = false;                          // mobil: sbalit = schovat
  else vydelekOdkryt = !vydelekOdkryt;
  renderHome();
}
function ulozProvizi(){
  const v = parseInt(String(provizeUprava || '').replace(/\D/g, ''), 10);
  if (!(v > 0)) { $('#provize').focus(); return; }
  try { localStorage.setItem(PROVIZE_KLIC, String(v)); } catch (e) {}
  provizeUprava = null; vydelekOdkryt = true; renderHome();
}

/* Hecovací věta podle množství práce – jedna věta na celý den (nemění se při obnovení seznamu) */

            'Žádné hovory. Ticho před bouří, nebo konkurence.', 'Prázdný seznam. Buď jsi výjimečný, nebo se zapomnělo zapsat.', 'Dnes nikomu. Zákazníci si zatím nerozmysleli, že koupí jinde.',
            'Kafe je zadarmo, tak pozvi zákazníka na showroom. Je to jediné, co dostane zdarma ☕'],
  malo:    ['Pár telefonů a máš hotovo 📞', 'Na rozcvičku akorát.', 'Tohle dáš do první kávy.', 'Malá dávka, velký efekt.',
            'Dokud nikdo nezvedne, má každý obchod stoprocentní šanci.', 'Tři telefony. Cesta na oběd bude delší.', 'Pár hovorů. Zvládneš i po obědě.'],
  stredne: ['Slušná porce. Hezky jeden po druhým.', 'Dneska se bude volat, kámo 💪', 'Rozjeď to, než přijde první zákazník do showroomu.', 'Každej hovor je o krok blíž k podpisu.',
            'Nezvedá? Zavolej znova. Pojišťovna to dělá taky a vydělává.', 'Zvedne to jen každý třetí. Zbytek je statistika, ne osobní selhání.', 'Volání je jako tankování: nikdo ho nemá rád, ale bez něj nedojedeš.'],
  hodne:   ['Fofr! Nejdřív ty červený, pak zbytek.', 'Dneska nejsi prodejce, dneska jsi call centrum 😅', 'Velká hromada = velká šance. Jedeme!', 'Kafe až po pátým hovoru ☕',
            'Tohle není práce, tohle je kardio pro hlasivky.', 'Dnes volej, jako by od toho záviselo, kdo platí oběd. Spoiler: záleží.', 'Hromada hovorů. Aspoň nebudeš mít pocit, že máš moc volného času.'],
  prosle:  ['Někdo už čeká déle, než by měl ⚠', 'Červený první, ty už se ozvat chtěj.', 'Prošlý kontakty chladnou. Ohřej je!',
            'Prošlé kontakty chladnou. Zákazníci se nezlobí, jen kupují jinde.', 'Zákazník čeká na zavolání. Konkurence čeká na tvoji chybu.', 'Červené jsou ti, co už pomalu zapomínají, že u nás chtěli koupit.']
};
function vetaDne(skupina){
  let h = 0; for (const ch of dnes() + skupina) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const vety = HECOVANI[skupina]; return vety[h % vety.length];
}
function hecni(volat){
  const n = volat.length;
  if (!n) return `<div class="empty">${esc(vetaDne('nula'))}</div>`;
  const skupina = n <= 3 ? 'malo' : n <= 8 ? 'stredne' : 'hodne';
  const prosle = volat.some(p => p.dalsiKontakt < dnes());
  return `<div class="hec">${esc(vetaDne(skupina))}</div>` + (prosle ? `<div class="hec late">${esc(vetaDne('prosle'))}</div>` : '');
}

/* v1.8: Komu zavolat, když dnes nikomu – jen přeskládá existující otevřené poptávky, nic nezapisuje.
   „Dlouho ticho“ = otevřená poptávka, u které se 14+ dní nic nezapsalo (úprava, změna stavu ani poznámka v historii);
   doplní ji nejbližší budoucí kontakt. Nejvýš 3 tipy, klepnutí otevře detail jako u každé karty. */
const TICHO_DNI = 14;
function posledniZapis(p){
  return Math.max(p.upraveno || 0, p.vytvoreno || 0, ...Object.values(p.historie || {}).map(h => h.t || 0));
}
function tipy(){
  const t = dnes(), ted = Date.now(), otevrene = vidiPoptavky().filter(p => OTEVRENE.includes(p.stav));
  const ticho = otevrene.map(p => ({p, dni: Math.floor((ted - posledniZapis(p)) / 86400000)}))
                        .filter(x => x.dni >= TICHO_DNI).sort((a, b) => b.dni - a.dni);
  const vyber = ticho.slice(0, 2).map(({p, dni}) => [p, `🔇 Dlouho ticho – ${dni} dní bez zápisu`]);
  otevrene.filter(p => p.dalsiKontakt && p.dalsiKontakt > t && !vyber.some(([q]) => q.id === p.id))
          .sort((a, b) => a.dalsiKontakt.localeCompare(b.dalsiKontakt))
          .slice(0, 3 - vyber.length)
          .forEach(p => vyber.push([p, `⏭ Na řadě ${p.dalsiKontakt === dnes(1) ? 'zítra' : fmtD(p.dalsiKontakt)} – klidně už dnes`]));
  if (!vyber.length) return '';
  return `<div class="tipy"><div class="tipy-nadpis">Komu zavolat, když dnes nikomu:</div>
    ${vyber.map(([p, duvod]) => `<div class="tip-duvod">${esc(duvod)}</div>${karta(p)}`).join('')}</div>`;
}

function renderSeznam(){
  let list = vidiPoptavky().filter(p => filtr==='otevrene' ? OTEVRENE.includes(p.stav) : filtr==='vse' ? true : p.stav===filtr);
  if (hledat.trim()) { const q = norm(hledat); list = list.filter(p => norm([p.jmeno,p.telefon,p.email,p.zajem,vuzTxt(p),...nabidkySerazene(p).map(n => n.model)].join(' ')).includes(q)); }
  // v1.15: řazení podle záhlaví (od 1200 px); výchozí nejnovější nahoře jako dřív
  const cena = p => (posledniNabidka(p) || {}).cena_sdph ?? -1, zisk = p => ziskNabidky(posledniNabidka(p)) ?? -Infinity;
  // v1.27: výchozí řazení „fáze“ – Nová → Jednáme → Nabídka odeslána → Prodáno → Ztraceno; uvnitř otevřených podle dalšího kontaktu (nejdřív prošlé a dnešní), uvnitř uzavřených podle poslední změny
  const FAZE = ['nova', 'jednani', 'nabidka', 'prodano', 'ztraceno'], fz = p => { const i = FAZE.indexOf(p.stav); return i < 0 ? 9 : i; };
  const dalsi = (a, b) => (a.dalsiKontakt || '9999').localeCompare(b.dalsiKontakt || '9999');
  const RAZENI = {faze: (a, b) => fz(a) - fz(b) || (OTEVRENE.includes(a.stav) ? dalsi(a, b) || (b.vytvoreno || 0) - (a.vytvoreno || 0) : (b.upraveno || 0) - (a.upraveno || 0)),
    cena: (a,b) => cena(b) - cena(a), zisk: (a,b) => zisk(b) - zisk(a), kontakt: (a,b) => dalsi(a, b)};
  list.sort(RAZENI[razeni] || RAZENI.faze);
  const raz = (k, txt, cls = '') => `<span class="${cls} raz" onclick="razeni = razeni === '${k}' ? 'faze' : '${k}'; renderSeznam()">${txt}${razeni === k ? ' ↓' : ''}</span>`;
  const hlava = `<div class="tab-hlava"><span>Zákazník</span><span>Řeší / vůz</span><span>Poslední zápis</span>${raz('cena', 'Nabídka')}<span class="sl">Sleva</span>
    <span class="zi"><span class="raz" onclick="razeni = razeni === 'zisk' ? 'faze' : 'zisk'; renderSeznam()">Zisk${razeni === 'zisk' ? ' ↓' : ''}</span>
      <span style="cursor:pointer" title="${ekoOdkryta ? 'Schovat zisk' : 'Ukázat zisk'}" onclick="ekoOdkryta = !ekoOdkryta; renderSeznam()">${ekoOdkryta ? '🙈' : '👁'}</span></span>
    <span class="st">Stav</span>${raz('kontakt', 'Další kontakt', 'kd')}<span></span></div>`;
  const sNab = list.map(posledniNabidka).filter(Boolean), sZiskem = sNab.filter(n => n.interni);
  const soucet = list.length ? `<div class="tab-soucet">Celkem ${list.length} ${list.length === 1 ? 'poptávka' : list.length <= 4 ? 'poptávky' : 'poptávek'}`
    + (sNab.length ? ` · ${sNab.length} s nabídkou za <b>${esc(kcK(sNab.reduce((s, n) => s + (n.cena_sdph || 0), 0)))}</b>` : ' · zatím bez nabídek')
    + (sZiskem.length ? ` · zisk <b>${ekoOdkryta ? '≈ ' + esc(kcK(sZiskem.reduce((s, n) => s + ziskNabidky(n), 0))) : '••• Kč'}</b>${sZiskem.length < sNab.length ? ` (z ${sZiskem.length} nabídek)` : ''}` : '') + '</div>' : '';
  // nadpisy skupin („Nabídka odeslána · 6“) jen ve výchozím řazení a když je skupin víc
  const stavy = [...new Set(list.map(p => p.stav))], skupiny = razeni === 'faze' && stavy.length > 1;
  const radky = list.map((p, i) => (skupiny && (i === 0 || list[i - 1].stav !== p.stav) ? `<div class="skup">${esc(STAVY[p.stav] || p.stav)} · ${list.filter(q => q.stav === p.stav).length}</div>` : '') + karta(p, true)).join('');
  $('#seznam').innerHTML = list.length ? hlava + radky + soucet : '<div class="empty">Nic tu není.</div>';
}

/* v1.15: ekonomika na přehledu. Poptávky nic nepočítají – jen ukazují poslední nabídku z Offer Studia.
   Zisk jen na PC a schovaný (👁, platí pro celou stránku do obnovení); na mobilu model · cena a poslední zápis. */
let ekoOdkryta = false, rozbalena = null, razeni = 'faze';
const OS_ADRESA = 'http://127.0.0.1:8774';
const posledniNabidka = p => nabidkySerazene(p)[0] || null;
const kcK = n => Math.round(n).toLocaleString('cs-CZ') + ' Kč';
function predKolika(ts){
  const d = Math.floor((Date.now() - ts) / 86400000);
  return d <= 0 ? 'dnes' : d === 1 ? 'včera' : d < 5 ? `před ${d} dny` : `před ${d} dny`;
}
function posledniPoznamka(p){   // v1.26: poslední skutečná poznámka; automatické řádky (Založeno, Stav →, 📄 Nabídka…, 🤝, ✓ Hotovo) zůstávají jen v historii v detailu
  const h = Object.values(p.historie || {}).filter(x => x && x.text && !AUTO_ZAPIS.test(x.text)).sort((a, b) => (b.t || 0) - (a.t || 0));
  return h[0] || null;
}
const ziskNabidky = n => n && n.interni ? (n.interni.skutecny_zisk != null ? n.interni.skutecny_zisk : n.interni.zisk) : null;
function ziskBunka(n){
  if (!n || !n.interni) return '<span class="muted">—</span>';
  if (!ekoOdkryta) return '<span class="muted">••• Kč</span>';
  const i = n.interni, m = i.skutecna_marze != null ? i.skutecna_marze : i.obchodni_marze;
  const cls = i.negativni || ziskNabidky(n) < 0 ? 'cervena' : i.nestandardni ? 'oranzova' : '';
  return `<span class="${cls}">${esc(kcK(ziskNabidky(n)))}</span><span class="m ${cls}">${esc(pctCz(m))}${i.negativni ? ' ⚠' : i.nestandardni ? ' ⚠' : ''}</span>`;
}
function ekonomika(p){
  const n = posledniNabidka(p), dalsich = nabidkySerazene(p).length - 1, r = (a, b) => `<div class="r"><span>${a}</span><b>${b}</b></div>`;
  let cena = '<div><h4>Nabídka</h4><div class="muted">Zatím bez nabídky.</div>' + (MOBIL.matches ? '' : `<div style="margin-top:6px"><a class="btn sec sm" href="${esc(odkazNabidky(p.id, p))}" target="offerstudio" onclick="event.stopPropagation()">📄 Udělat nabídku</a></div>`) + '</div>';
  let zisk = '<div><h4>Zisk</h4><div class="muted">—</div></div>', info = '<div></div>';
  if (n) {
    const katalog = (n.cena_vuz_sdph || 0) + (n.sleva_sdph || 0);
    cena = `<div><h4>Cena pro zákazníka</h4>${r('Ceníková cena', esc(kcK(katalog)))}${r('Sleva', esc((n.sleva_sdph ? '− ' + kcK(n.sleva_sdph) : '0 Kč') + ` (${pctCz(n.sleva_pct || 0)})`))}
      ${n.doplnky_sdph ? r('Cena vozu', esc(kcK(n.cena_vuz_sdph || 0))) + r('Doplňkový prodej', '+ ' + esc(kcK(n.doplnky_sdph))) : ''}${r('Celkem s DPH', esc(kcK(n.cena_sdph || 0)))}</div>`;   // v1.27: bez doplňků je „Cena vozu“ totéž co „Celkem“
    const i = n.interni;
    if (i) zisk = ekoOdkryta
      ? `<div><h4>Zisk (jen pro tebe)</h4>${r('Zisk', esc(kcK(i.zisk)))}${i.korekce ? r('Korekce (dealer hradí)', '− ' + esc(kcK(i.korekce))) : ''}
        ${r('Skutečný zisk', `<span class="${ziskNabidky(n) < 0 ? 'cervena' : ''}">${esc(kcK(ziskNabidky(n)))}</span>`)}${r('Obchodní marže', `<span class="${i.negativni ? 'cervena' : i.nestandardni ? 'oranzova' : ''}">${esc(pctCz(i.obchodni_marze))}</span>`)}
        ${i.skutecna_marze != null ? r('Skutečná marže', esc(pctCz(i.skutecna_marze))) : ''}${i.negativni ? '<div class="cervena">⚠ pod nákupní cenou</div>' : i.nestandardni ? '<div class="oranzova">⚠ nízká marže</div>' : ''}</div>`
      : `<div><h4>Zisk (jen pro tebe)</h4><div class="skryte" onclick="event.stopPropagation(); ekoOdkryta = true; renderSeznam()">Zisk ••• Kč · marže ••• – klepni pro zobrazení</div></div>`;
    else zisk = '<div><h4>Zisk</h4><div class="muted">V nabídce nebyla zadaná nákupní marže.</div></div>';
    info = `<div><h4>${esc(n.model || 'Nabídka')}</h4>${r('Připravena', esc(n.t ? new Date(n.t).toLocaleDateString('cs-CZ') + ' · ' + predKolika(n.t) : '—'))}
      ${n.soubor ? r('Soubor', `<span class="soub" title="${esc(n.soubor)}">${esc(n.soubor)}</span>`) : ''}${dalsich > 0 ? r('Starší nabídky', esc(String(dalsich))) : ''}
      ${MOBIL.matches ? '' : `<div style="margin-top:6px"><a class="btn sec sm" href="${esc(OS_ADRESA + '/draft/' + encodeURIComponent(Object.keys(p.nabidky).find(k => p.nabidky[k] === n) || ''))}" target="offerstudio" onclick="event.stopPropagation()">📂 Otevřít v Offer Studiu</a></div>`}</div>`;
  }
  const hist = Object.values(p.historie || {}).sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 4);
  return `<div class="eko" onclick="event.stopPropagation()">${cena}${zisk}${info}
    <div class="hist"><h4>Co jsem s ním řešil</h4>${hist.map(h => `<div><small>${esc(fmtTs(h.t))}</small> ${esc(h.text)}</div>`).join('') || '<div class="muted">—</div>'}</div></div>`;
}
function karta(p, vSeznamu, kompakt){   // kompakt (v1.26): karta v „Dnes zavolat“ – jméno, co chce, poslední poznámka; termín jen když je prošlý
  const k = kdyKontakt(p), n = posledniNabidka(p), pz = posledniPoznamka(p);
  const nab = n ? `<span class="nm">📄 ${esc(n.model || 'Nabídka')}</span><span class="tc"> · </span><span class="pr"><b>${esc(kcK(n.cena_sdph || 0))}</b>${n.sleva_sdph ? `<span class="sl-in"> · sleva ${esc(pctCz(n.sleva_pct || 0))}</span>` : ''}</span>` : '';   // v1.26: model a cena zvlášť, aby se cena v tabulce nikdy neuřízla
  const slevaTxt = n && n.sleva_sdph ? esc(pctCz(n.sleva_pct || 0)) : '—';
  return `<div class="card${kompakt ? ' kompakt' : ''}" onclick="renderDetail('${p.id}')">
    <div class="top"><span class="name">${esc(p.jmeno || p.telefon || p.email || '(bez jména)')}</span>
      <span class="badge b-${p.stav}">${STAVY[p.stav]||p.stav}</span></div>
    <div class="co"><div class="co-a">${vlastnik(p)}<div class="sub">${(KANALY[p.kanal]||'').split(' ')[0]} ${esc(p.zajem || '')}</div>
      ${vuzTxt(p) && !kompakt ? `<div class="vuz-radek" title="${esc(vuzTxt(p))}">🚗 ${esc(vuzTxt(p))}</div>` : ''}
      ${dohodaRadek(p)}</div>
      <div class="co-b">${pz ? `<div class="posl" title="${esc(pz.text)}">💬 ${esc(pz.text)} · ${esc(predKolika(pz.t || 0))}</div>` : ''}</div></div>
    ${kompakt ? '' : n ? `<div class="nab-radek">${nab}</div>` : '<div class="nab-radek prazdne">bez nabídky</div>'}
    ${vSeznamu ? `<div class="sl-sl">${slevaTxt}</div>` : ''}
    ${vSeznamu && !MOBIL.matches ? `<div class="zisk-sl">${ziskBunka(n)}</div>` : ''}
    ${k && (!kompakt || /late/.test(k)) ? `<div class="sub kdy"><span class="lbl">Další kontakt: </span>${k}</div>` : ''}
    ${vSeznamu && !MOBIL.matches ? `<button type="button" class="chev" title="Ekonomika poptávky" onclick="event.stopPropagation(); rozbalena = rozbalena === '${p.id}' ? null : '${p.id}'; renderSeznam()">${rozbalena === p.id ? '▾' : '▸'}</button>
      ${rozbalena === p.id && !MOBIL.matches ? ekonomika(p) : ''}` : ''}
  </div>`;
}

function vuzZmena(){   // lokace dává smysl u skladového a od dealera
  const k = $('#f-vuz-puvod').value; $('#f-vuz-lokace').classList.toggle('hidden', k === 'vyroba' || !k);
}
function kanalZmena(){
  const k = document.querySelector('input[name=kanal]:checked').value;
  document.querySelectorAll('#kanaly .chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
  $('#paste')?.classList.toggle('hidden', k !== 'email');
}

function vytahni(){
  const t = $('#f-paste').value; if (!t.trim()) return;
  const myDom = (user.email.split('@')[1] || '').toLowerCase();
  const mails = (t.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || []).filter(m => !m.toLowerCase().endsWith('@' + myDom));
  const tel = (t.match(/(\+420[\s-]?)?\b\d{3}[\s-]?\d{3}[\s-]?\d{3}\b/) || [])[0];
  let jm = ''; const m = t.match(/^(?:Od|From)\s*:\s*"?([^"<\[\n\r]+?)"?\s*[<\[]/m);
  if (m) jm = m[1].trim();
  if (!jm && mails[0]) { const lp = mails[0].split('@')[0]; if (/^[a-z]+[._][a-z]+$/i.test(lp)) jm = lp.split(/[._]/).map(cap).join(' '); }
  const fill = (sel, v) => { if (v && !$(sel).value.trim()) $(sel).value = v; };
  fill('#f-jmeno', jm); fill('#f-mail', mails[0]); fill('#f-tel', tel); fill('#f-zajem', t.trim().slice(0, 1500));
  if ($('#zakaznici')) prekresli();
}

function ulozit(id){
  const v = {
    kanal: document.querySelector('input[name=kanal]:checked').value,
    jmeno: $('#f-jmeno').value.trim(), telefon: $('#f-tel').value.trim(), email: $('#f-mail').value.trim(),
    zajem: $('#f-zajem').value.trim(), dalsiKontakt: $('#f-dalsi').value || null, upraveno: TS()
  };
  const vz = {puvod: $('#f-vuz-puvod').value, id: $('#f-vuz-id').value.trim(), lokace: $('#f-vuz-lokace').value.trim()};
  if (vz.puvod === 'vyroba' || !vz.puvod) vz.lokace = '';
  v.vuz = (vz.puvod || vz.id || vz.lokace) ? Object.fromEntries(Object.entries(vz).filter(([, x]) => x)) : null;   // v1.16
  if (!v.telefon && !v.email) { $('#f-err').textContent = 'Vyplň aspoň telefon nebo e-mail – jinak se mu neozveš 🙂'; return; }
  if (id) { db.ref('poptavky/' + id).update(v).then(() => renderDetail(id)); return; }
  const pozn = $('#f-pozn').value.trim(), volbaNovy = novy;
  ulozPoptavku(v, pozn).then(r => {
    const text = r.jak === 'neovereno' ? (volbaNovy
        ? 'Uloženo bez zákazníka – údaje sedí i na zákazníka, kterého jsi v nabídce neviděl.'
        : 'Uloženo bez zákazníka – v evidenci je možná shoda, kterou jsi nevybral.')
      : r.jak === 'bez' && volbaNovy ? 'Zákazník se nezaložil – chybí jméno nebo platný telefon/e-mail.' : '';
    poUlozeni = text ? {id: r.id, text} : null;
    window.posledniVysledek = r;                         // pro automatické testy
    renderDetail(r.id);
  }).catch(e => $('#f-err').textContent = 'Uložení selhalo: ' + e.message);
}

/* v1.18: tlačítko Zpět prohlížeče (i gesto/myš) vrací z detailu a formuláře o krok zpět, ne ven z appky. */
let ignorujPop = false, jeVedouci = false;
document.addEventListener('keydown', e => {   // v1.19: Esc = zpět na přehled (ne při psaní do pole)
  if (e.key !== 'Escape' || e.defaultPrevented || !user) return;
  const t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (view === 'detail') { e.preventDefault(); zpetNaPrehled(); }
});
const PODSTR = ['detail', 'form', 'tyden', 'porada'];
function stavHistorie(v, id){
  const st = history.state;
  try {
    if (v === 'detail' && st && st.v === 'form' && st.id && !ignorujPop) { ignorujPop = true; history.back(); return; }   // úprava hotová → zpět na záznam detailu
    if (v === 'detail' && ignorujPop) return;
    if (st && st.v === v) history.replaceState({v, id}, '');
    else if (v === 'form' && st && st.v === 'detail') history.pushState({v, id}, '');
    else if (v === 'detail' && st && (st.v === 'tyden' || st.v === 'porada')) history.pushState({v, id}, '');
    else if (st && PODSTR.includes(st.v) && v !== 'tyden' && v !== 'porada') history.replaceState({v, id}, '');
    else history.pushState({v, id}, '');
  } catch (e) { /* např. file:// v některých prohlížečích */ }
}
function zpetNaPrehled(){
  if (history.state && PODSTR.includes(history.state.v) && history.length > 1) { history.back(); return; }
  renderHome();
}
window.addEventListener('popstate', e => {
  if (ignorujPop) { ignorujPop = false; return; }
  const st = e.state;
  if (!user) return;
  if (st && st.v === 'detail' && data[st.id]) renderDetail(st.id);
  else if (st && st.v === 'tyden') renderTyden(true);
  else if (st && st.v === 'porada' && jeVedouci) renderPorada(true);
  else if (view !== 'home') renderHome(true);
});

      <span class="drobek">Poptávky › <span class="jm">${esc(p.jmeno || '(bez jména)')}</span></span><span class="drobek" style="flex:0 0 auto">zpět: <kbd>Esc</kbd></span></div>

      ${zakaznikDetailu(p)}
      ${poUlozeni && poUlozeni.id === id ? `<div class="hint" style="margin-top:6px">${esc(poUlozeni.text)}</div>` : ''}
      <div class="row">

        ${p.email ? `<a class="btn sec" href="mailto:${esc(p.email)}">✉️ ${esc(p.email)}</a>` : ''}
      </div>

      <div class="row kontakt" style="margin-top:0">

/* v1.9: Souhlas GDPR – připraví SMS s odkazem na formulář souhlasu Mercedes-Benz (bez předvyplnění, formulář údaje
   z odkazu nepřebírá). Odešle prodejce sám ve Zprávách; do Poptávek se nic nezapisuje.
   E-mail záměrně není: mailto: umí jen prostý text, nový Outlook z něj klikací odkaz neudělá a kopírování přes schránku
   by prodejci přidalo práci (rozhodnutí uživatele). */
const GDPR_ODKAZ = 'https://www.mercedes-benz.cz/passengercars/content-pool/marketing-pool/contact-forms/doc.html?d=2021-06-22&can=RetailWeb&cpid=doc_ms_7672&le=D-Outlet.9058&s=generic_landing_page';
// Odkaz na samostatném řádku – Zprávy ho tak spolehlivě rozpoznají (v okně psaní bývá ještě černý, modrý je až po odeslání)
const GDPR_TEXT = `Dobrý den,\nposílám odkaz na souhlas se zpracováním osobních údajů pro Mercedes-Benz:\n\n${GDPR_ODKAZ}\n\nDěkuji, S. & W. Automobily`;
function gdprOdkazy(p){
  const tel = (p.telefon || '').replace(/[^\d+]/g, '');
  return tel ? [[`sms:${tel}?&body=${encodeURIComponent(GDPR_TEXT)}`, '💬 Poslat SMS']] : [];   // „?&body=“ funguje v iPhonu i Androidu
}
/* Panel „Další akce“ – kontakt do iPhonu, úprava, smazání (s potvrzením přímo v panelu) */
function otevriAkce(id){
