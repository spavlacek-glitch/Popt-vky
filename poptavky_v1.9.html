<!doctype html>
<html lang="cs">
<head>
<!-- Poptávky – evidence poptávek | verze 1.9 | 2026-10-29
     v1.1: hecovací věta dne v „Dnes zavolat“
     v1.2: známý zákazník u nové poptávky (/zakaznici) – vyhledání, Vybrat, „Je to nový zákazník“; převzato z ověřeného experimentu v0.5
     v1.3: jen vzhled přehledu – „Dnes zavolat“ odděleně od evidence, na PC dva sloupce, nízká hlavička na mobilu;
           v detailu na mobilu modré plovoucí „← Přehled“ dole vlevo; historie kontaktů v detailu sbalená
     v1.4: „📱 Uložit do kontaktů“ v detailu – soubor vCard (.vcf) z ověřeného experimentu vcard_v0.1, volitelné označení kontaktu
     v1.5: nový detail poptávky jen na mobilu (do 600 px) podle schváleného prototypu; detail na PC beze změny (v1.4)
     v1.6: kontakt v iPhonu nese odkaz „Poptávky“ (poptavky.html#poptavka=<id>), který otevře rovnou detail poptávky;
           ověřeno experimentem vcard_odkaz_v0.1
     v1.7: jen vzhled přehledu na PC – širší, „Dnes zavolat“ přilepené vlevo, export v hlavičce evidence,
           hledání a filtry na jednom řádku, od 1200 px poptávky jako řádky ve sloupcích; mobil beze změny
     v1.8: prázdné „Dnes zavolat“ nabídne až 3 tipy, komu zavolat – „Dlouho ticho“ (otevřená poptávka 14+ dní bez zápisu)
           a nejbližší budoucí kontakt; jen čtení dat, nic se nezapisuje
     v1.9: „Souhlas GDPR“ v detailu – připraví SMS nebo e-mail s odkazem na formulář souhlasu MB; odešle prodejce sám,
           nic se nezapisuje; e-mail: text s klikacím odkazem (HTML) do schránky + Outlook s příjemcem a předmětem, Ctrl+V -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poptávky">
<meta name="theme-color" content="#111111">
<title>Poptávky v1.9</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111;--muted:#6b7280;--line:#e5e7eb;--acc:#0078d6;--red:#dc2626;--green:#16a34a;--amber:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.hidden{display:none!important}
header{background:#111;color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer;white-space:nowrap}
header small{color:#9ca3af;font-size:12px}
header button{background:none;border:1px solid #444;color:#ddd;border-radius:8px;padding:5px 9px;font-size:13px;flex-shrink:0}
#who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 100px}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-weight:600}
.card .sub{color:var(--muted);font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#e5e7eb;white-space:nowrap}
.b-nova{background:#dbeafe;color:#1e40af}.b-nabidka{background:#fef3c7;color:#92400e}.b-jednani{background:#ede9fe;color:#5b21b6}
.b-prodano{background:#dcfce7;color:#166534}.b-ztraceno{background:#f3f4f6;color:#6b7280}
.late{color:var(--red);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:14px}
.hec{color:var(--muted);font-size:14px;margin:-4px 0 8px}
.hec.late{color:var(--red)}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips input{display:none}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;text-align:center}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
#fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:16px}
.box{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.hist{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:14px}
.hist small{color:var(--muted);display:block}
/* v1.3: historie v detailu sbalená – klepnutím na nadpis rozbalit / sbalit */
.historie{margin-top:12px;border-top:1px solid var(--line)}
.historie summary{list-style:none;cursor:pointer;position:relative;min-height:44px;padding:10px 28px 8px 0;font-size:15px;font-weight:600}
.historie summary::-webkit-details-marker{display:none}
.historie summary::after{content:'▾';position:absolute;right:4px;top:10px;color:var(--muted);transition:transform .15s}
.historie[open] summary::after{transform:rotate(180deg)}
.kontakt input{flex:1 1 160px;min-width:0}
.kontakt .btn{flex:0 0 auto;white-space:nowrap}
/* v1.5: detail na mobilu (vykresluje se jen do 600 px) */
.md-karta{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.md-stavy{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.md-stavy .badge{font-size:12.5px;font-weight:600;padding:3px 10px}
.md-termin{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f9fafb;color:var(--muted);border:1px solid var(--line)}
.md-termin.dnes{background:#e6f1fb;color:var(--acc);border-color:transparent}
.md-termin.pozde{background:#fef2f2;color:var(--red);border-color:transparent}
.md-jmeno{font-size:24px;margin:8px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.md-meta{color:var(--muted);font-size:13px}
.md-label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.md-cochce{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16.5px}
.md-cochce.zkr{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.md-odkaz{background:none;border:0;padding:6px 0 0;color:var(--acc);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.md-kontakt{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:16px}
.md-kontakt.jeden{grid-template-columns:1fr}
.md-akce{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:58px;border-radius:12px;padding:8px 14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;min-width:0}
.md-akce b{font-size:16px}
.md-akce span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.md-akce.hlavni{background:var(--acc);border-color:var(--acc);color:#fff}
.md-akce.hlavni span{color:#dbeafe}
.md-nadpis{font-size:17px;margin:0 0 2px}
.md-pod{color:var(--muted);font-size:13px;margin:0 0 6px}
.md-zapsat{display:flex;justify-content:flex-end;margin-top:8px}
.md-zapsat .btn{border-radius:99px;min-height:44px;padding:11px 20px}
.md-zapsat .btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.md-oddel{height:1px;background:var(--line);margin:16px 0}
.md-datum{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.md-datum .md-label{margin:0}
.md-datum b{font-size:18px;text-align:right}
.md-datum b.pozde{color:var(--red)}
.md-chipy{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.md-chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;min-height:40px;font:inherit;font-size:15px;
  display:inline-flex;align-items:center;position:relative;cursor:pointer;color:var(--ink)}
.md-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.md-chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.md-seg{display:grid;grid-template-columns:1fr 1.65fr 1fr;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.md-seg button{border:0;background:none;border-radius:9px;min-height:42px;padding:4px 6px;font:inherit;font-size:14.5px;line-height:1.15;font-weight:600;color:var(--muted);text-wrap:balance;cursor:pointer}
.md-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.md-uzavrit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.md-uzavrit button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink)}
.md-uzavrit .prodano.on{background:#dcfce7;border-color:var(--green);color:var(--green)}
.md-uzavrit .ztraceno.on{background:var(--line);border-color:var(--muted)}
.md-hist{margin-top:0;border-top:0}
.md-vic{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:4;border-radius:99px;min-height:48px;padding:0 20px;
  font:inherit;font-size:16px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.md-zavoj{position:fixed;inset:0;background:rgba(17,17,17,.38);z-index:20}
.md-panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:85vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md-uchyt{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.md-panel h3{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}
.md-vcf{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.md-vcf label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.md-r{display:flex;gap:8px;flex-wrap:wrap}
.md-r input{flex:1 1 150px;min-width:0}
.md-r .btn{border-radius:99px;min-height:44px;white-space:nowrap}
.md-radek{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);background:none;
  text-align:left;font:inherit;font-size:16px;padding:0 2px;cursor:pointer;color:var(--ink)}
.md-radek span{width:28px;text-align:center}
.md-radek.cervena{color:var(--red)}
.md-potvrd{background:#fef2f2;border-radius:12px;padding:12px;margin-top:8px}
.md-potvrd p{margin:0 0 10px;font-size:14.5px}
.md-r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.md-r2 .btn{border-radius:99px;min-height:44px}
.btn.md-smazat{background:var(--red)}
.historie .posledni{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--red);font-size:14px;margin-top:8px}
.tools{display:flex;gap:8px;margin-top:8px}
/* v1.2: známý zákazník */
.hint{color:var(--muted);font-size:13px}
.panel{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.panel b{font-size:14px}
#zakaznici:empty{display:none}
.zak{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;overflow-wrap:anywhere;background:#fff}
.zak.silna{border-color:#86efac;background:#f0fdf4}
.zak .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.zak .name{font-weight:600}
.zak .sub{color:var(--muted);font-size:14px;margin-top:2px}
.zak table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.zak td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.zak td.d{text-align:right;white-space:nowrap;color:var(--muted)}
.b-tel{background:#dcfce7;color:#166534}.b-jm{background:#fef3c7;color:#92400e}
/* v1.3: přehled – dnešní úkoly v teplém panelu odděleně od evidence; na PC dva sloupce.
   Místo pro budoucí ceny: na kartě vpravo u štítku stavu, souhrn hodnot vpravo v .sekce-hlava evidence. */
.dnes{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:2px 12px 6px;margin-bottom:8px}
.dnes h2{margin-top:12px}
.dnes .empty{padding:8px 4px 12px}
/* v1.8: tipy, komu zavolat, když „Dnes zavolat“ je prázdné */
.tipy-nadpis{font-size:14px;font-weight:600;margin:2px 0 8px}
.tip-duvod{font-size:12.5px;font-weight:600;color:var(--amber);margin:0 0 3px 4px}
/* v1.9: souhlas GDPR */
.gdpr{align-items:center}
.gdpr .hint{flex:0 0 auto}
.gdpr .btn{flex:0 0 auto}
a.md-radek{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;max-width:min(92vw,520px);
  background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sekce-hlava{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (min-width:960px){
  main:has(.dash){max-width:1240px}
  .dash{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:24px;align-items:start}
  .dash .dnes{margin-top:6px;margin-bottom:0}
  /* v1.7: pracovní přehled na PC – širší, „Dnes zavolat“ zůstává při posouvání vidět, export v hlavičce evidence,
     od 1200 px hledání a filtry na jednom řádku. Jen CSS, pořadí prvků (a tím mobil) beze změny. */
  main:has(.dash){max-width:1600px;padding-left:24px;padding-right:24px}
  .dash{grid-template-columns:minmax(320px,380px) minmax(0,1fr)}
  .dash .dnes{position:sticky;top:63px;max-height:calc(100vh - 79px);overflow-y:auto}
  .evidence{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center}
  .evidence .sekce-hlava{grid-column:1}
  .evidence .tools{grid-column:2;grid-row:1;margin:0;justify-self:end}
  .evidence #hledat,.evidence .chips{grid-column:1 / -1}
  .evidence #seznam{grid-column:1 / -1;margin-top:12px}
  .dash .card:hover{box-shadow:0 0 0 1px #cbd5e1,0 2px 6px rgba(0,0,0,.08)}
}
/* v1.7: na širokém PC je poptávka v evidenci jeden řádek: jméno | co chce | další kontakt | stav */
@media (min-width:1200px){
  .evidence #hledat{grid-column:1}
  .evidence .chips{grid-column:2;margin:0}
  #seznam .card{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.4fr) 220px 130px;grid-template-areas:"jm co kdy st";
    align-items:center;column-gap:16px;padding:10px 14px;margin-bottom:6px}
  #seznam .card .top{display:contents}
  #seznam .card .name{grid-area:jm;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #seznam .card .badge{grid-area:st;justify-self:end}
  #seznam .card .sub{grid-area:co;margin:0}
  #seznam .card .sub + .sub{grid-area:kdy}
}
@media (max-width:600px){
  header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  #who{display:none}
  /* „← Přehled“ v detailu na dosah palce: modré plovoucí tlačítko dole vlevo (jako „+ Nová poptávka“), nad bezpečnou oblastí iPhonu.
     Spodní odstup stránky je vždy větší než tlačítko, takže obsah jde celý odrolovat nad něj.
     Při psaní do pole se schová, aby nezakrylo pole ani klávesnici. (Tmavá spodní lišta zabírala moc místa – vráceno.) */
  .zpet{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:4;margin:0}
  .zpet .btn.sec{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:12px 18px;font-size:16px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  main:has(.zpet){padding-bottom:max(100px, calc(84px + env(safe-area-inset-bottom, 0px)))}
  /* v1.5: při psaní se tlačítka schovají hned, vrátí se až 0,3 s po opuštění pole – jinak by se při klepnutí na
     „Zapsat poznámku“ vynořila přímo pod prstem a klepnutí by dostala ona (ověřeno testem na šířce iPhonu SE) */
  .zpet,.md-vic{transition:visibility 0s linear .3s}
  body:has(#view input:focus, #view textarea:focus) .zpet,
  body:has(#view input:focus, #view textarea:focus) .md-vic{visibility:hidden;transition-delay:0s}
}
</style>
</head>
<body>

<div id="login" class="hidden"><main>
  <h1 style="margin-top:40px">Poptávky</h1>
  <p style="color:var(--muted)">Přihlas se firemním účtem z Firebase.</p>
  <label class="f">E-mail</label><input id="l-mail" type="email" autocomplete="username">
  <label class="f">Heslo</label><input id="l-pass" type="password" autocomplete="current-password">
  <div class="row"><button class="btn" onclick="prihlasit()">Přihlásit</button></div>
  <div id="l-err" class="err"></div>
</main></div>

<div id="app" class="hidden">
  <header>
    <h1 onclick="renderHome()">Poptávky <small>v1.9</small></h1>
    <small id="who"></small>
    <button onclick="auth.signOut()">Odhlásit</button>
  </header>
  <main id="view"></main>
  <button id="fab" class="btn" onclick="renderForm()">+ Nová poptávka</button>
  <div id="md-zavoj" class="md-zavoj hidden" onclick="zavriAkce()"></div>
  <div id="md-panel" class="md-panel hidden" role="dialog" aria-modal="true" aria-label="Další akce"></div>
</div>

<script>
/* ===== NASTAVENÍ – doplň z Firebase konzole (Project settings → Your apps → Web) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyD0iDpkNfycvqqsiCEEWUg5DUnYy_PpFiY",
  authDomain: "poptavky-sw.firebaseapp.com",
  databaseURL: "https://poptavky-sw-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "poptavky-sw",
  storageBucket: "poptavky-sw.firebasestorage.app",
  messagingSenderId: "602272019737",
  appId: "1:602272019737:web:3e5d564c80f0b3346cc188"
};
/* ================================================================================== */

const STAVY = {nova:'Nová', nabidka:'Nabídka odeslána', jednani:'Jednáme', prodano:'Prodáno', ztraceno:'Ztraceno'};
const OTEVRENE = ['nova','nabidka','jednani'];
const KANALY = {showroom:'🏢 Showroom', telefon:'📞 Telefon', email:'✉️ E-mail'};
const TS = () => firebase.database.ServerValue.TIMESTAMP;

let data = {}, view = 'home', curId = null, filtr = 'otevrene', hledat = '', user = null, ref = null;
let ZAKAZNICI = [], zakRef = null, vybrany = null, novy = null, poUlozeni = null;   // v1.2: známý zákazník
let oznaceni = {id: null, text: ''};   // v1.4: rozepsané označení kontaktu – živé překreslení detailu ho nesmaže
let historieOtevrena = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s/g,'');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
function dnes(off = 0){ const d = new Date(); d.setDate(d.getDate() + off);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${+d}. ${+m}. ${y}`; }
function fmtTs(ts){ if(!ts) return ''; const d = new Date(ts);
  return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}); }
function kdyKontakt(p){ if(!p.dalsiKontakt || !OTEVRENE.includes(p.stav)) return '';
  const t = dnes(); const late = p.dalsiKontakt < t;
  return `<span class="${late?'late':''}">${p.dalsiKontakt===t?'dnes':fmtD(p.dalsiKontakt)}${late?' ⚠':''}</span>`; }
const psani = () => ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);

function vsechny(){ return Object.entries(data).map(([id,p]) => ({id, ...p})); }

function renderHome(){

  const volat = vsechny().filter(p => OTEVRENE.includes(p.stav) && p.dalsiKontakt && p.dalsiKontakt <= t)

  const chip = (k, txt) => `<span class="chip ${filtr===k?'on':''}" onclick="filtr='${k}';renderHome()">${txt}</span>`;

      ${hecni(volat)}
      ${volat.map(karta).join('')}
      ${volat.length ? '' : tipy()}
    </section>

      <div class="chips">${chip('otevrene','Otevřené')}${chip('prodano','Prodáno')}${chip('ztraceno','Ztraceno')}${chip('vse','Vše')}</div>

/* Hecovací věta podle množství práce – jedna věta na celý den (nemění se při obnovení seznamu) */
const HECOVANI = {
  nula:    ['Dnes nikomu. Kafe si zasloužíš ☕', 'Dneska teda nic moc, kámo. Co takhle obejít showroom?', 'Čistý stůl, čistá hlava.', 'Nikdo nečeká. Ideální den ulovit novou poptávku 🎯'],
  malo:    ['Pár telefonů a máš hotovo 📞', 'Na rozcvičku akorát.', 'Tohle dáš do první kávy.', 'Malá dávka, velký efekt.'],
  stredne: ['Slušná porce. Hezky jeden po druhým.', 'Dneska se bude volat, kámo 💪', 'Rozjeď to, než přijde první zákazník do showroomu.', 'Každej hovor je o krok blíž k podpisu.'],
  hodne:   ['Fofr! Nejdřív ty červený, pak zbytek.', 'Dneska nejsi prodejce, dneska jsi call centrum 😅', 'Velká hromada = velká šance. Jedeme!', 'Kafe až po pátým hovoru ☕'],
  prosle:  ['Někdo už čeká déle, než by měl ⚠', 'Červený první, ty už se ozvat chtěj.', 'Prošlý kontakty chladnou. Ohřej je!']
};
function vetaDne(skupina){
  let h = 0; for (const ch of dnes() + skupina) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const vety = HECOVANI[skupina]; return vety[h % vety.length];
}
function hecni(volat){
  const n = volat.length;
  if (!n) return `<div class="empty">${esc(vetaDne('nula'))}</div>`;
  const skupina = n <= 3 ? 'malo' : n <= 8 ? 'stredne' : 'hodne';
  const prosle = volat.some(p => p.dalsiKontakt < dnes());
  return `<div class="hec">${esc(vetaDne(skupina))}</div>` + (prosle ? `<div class="hec late">${esc(vetaDne('prosle'))}</div>` : '');
}

/* v1.8: Komu zavolat, když dnes nikomu – jen přeskládá existující otevřené poptávky, nic nezapisuje.
   „Dlouho ticho“ = otevřená poptávka, u které se 14+ dní nic nezapsalo (úprava, změna stavu ani poznámka v historii);
   doplní ji nejbližší budoucí kontakt. Nejvýš 3 tipy, klepnutí otevře detail jako u každé karty. */
const TICHO_DNI = 14;
function posledniZapis(p){
  return Math.max(p.upraveno || 0, p.vytvoreno || 0, ...Object.values(p.historie || {}).map(h => h.t || 0));
}
function tipy(){
  const t = dnes(), ted = Date.now(), otevrene = vsechny().filter(p => OTEVRENE.includes(p.stav));
  const ticho = otevrene.map(p => ({p, dni: Math.floor((ted - posledniZapis(p)) / 86400000)}))
                        .filter(x => x.dni >= TICHO_DNI).sort((a, b) => b.dni - a.dni);
  const vyber = ticho.slice(0, 2).map(({p, dni}) => [p, `🔇 Dlouho ticho – ${dni} dní bez zápisu`]);
  otevrene.filter(p => p.dalsiKontakt && p.dalsiKontakt > t && !vyber.some(([q]) => q.id === p.id))
          .sort((a, b) => a.dalsiKontakt.localeCompare(b.dalsiKontakt))
          .slice(0, 3 - vyber.length)
          .forEach(p => vyber.push([p, `⏭ Na řadě ${p.dalsiKontakt === dnes(1) ? 'zítra' : fmtD(p.dalsiKontakt)} – klidně už dnes`]));
  if (!vyber.length) return '';
  return `<div class="tipy"><div class="tipy-nadpis">Komu zavolat, když dnes nikomu:</div>
    ${vyber.map(([p, duvod]) => `<div class="tip-duvod">${esc(duvod)}</div>${karta(p)}`).join('')}</div>`;
}

function renderSeznam(){
  let list = vsechny().filter(p => filtr==='otevrene' ? OTEVRENE.includes(p.stav) : filtr==='vse' ? true : p.stav===filtr);
  if (hledat.trim()) { const q = norm(hledat); list = list.filter(p => norm([p.jmeno,p.telefon,p.email,p.zajem].join(' ')).includes(q)); }
  list.sort((a,b) => (b.vytvoreno||0) - (a.vytvoreno||0));
  $('#seznam').innerHTML = list.length ? list.map(karta).join('') : '<div class="empty">Nic tu není.</div>';
}

function karta(p){
  const k = kdyKontakt(p);
  return `<div class="card" onclick="renderDetail('${p.id}')">
    <div class="top"><span class="name">${esc(p.jmeno || p.telefon || p.email || '(bez jména)')}</span>
      <span class="badge b-${p.stav}">${STAVY[p.stav]||p.stav}</span></div>
    <div class="sub">${(KANALY[p.kanal]||'').split(' ')[0]} ${esc(p.zajem || '')}</div>
    ${k ? `<div class="sub">Další kontakt: ${k}</div>` : ''}
  </div>`;
}

function kanalZmena(){
  const k = document.querySelector('input[name=kanal]:checked').value;
  document.querySelectorAll('#kanaly .chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
  $('#paste')?.classList.toggle('hidden', k !== 'email');
}

function vytahni(){
  const t = $('#f-paste').value; if (!t.trim()) return;
  const myDom = (user.email.split('@')[1] || '').toLowerCase();
  const mails = (t.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g) || []).filter(m => !m.toLowerCase().endsWith('@' + myDom));
  const tel = (t.match(/(\+420[\s-]?)?\b\d{3}[\s-]?\d{3}[\s-]?\d{3}\b/) || [])[0];
  let jm = ''; const m = t.match(/^(?:Od|From)\s*:\s*"?([^"<\[\n\r]+?)"?\s*[<\[]/m);
  if (m) jm = m[1].trim();
  if (!jm && mails[0]) { const lp = mails[0].split('@')[0]; if (/^[a-z]+[._][a-z]+$/i.test(lp)) jm = lp.split(/[._]/).map(cap).join(' '); }
  const fill = (sel, v) => { if (v && !$(sel).value.trim()) $(sel).value = v; };
  fill('#f-jmeno', jm); fill('#f-mail', mails[0]); fill('#f-tel', tel); fill('#f-zajem', t.trim().slice(0, 1500));
  if ($('#zakaznici')) prekresli();
}

function ulozit(id){
  const v = {
    kanal: document.querySelector('input[name=kanal]:checked').value,
    jmeno: $('#f-jmeno').value.trim(), telefon: $('#f-tel').value.trim(), email: $('#f-mail').value.trim(),

  };
  if (!v.telefon && !v.email) { $('#f-err').textContent = 'Vyplň aspoň telefon nebo e-mail – jinak se mu neozveš 🙂'; return; }
  if (id) { db.ref('poptavky/' + id).update(v).then(() => renderDetail(id)); return; }
  const pozn = $('#f-pozn').value.trim(), volbaNovy = novy;
  ulozPoptavku(v, pozn).then(r => {
    const text = r.jak === 'neovereno' ? (volbaNovy
        ? 'Uloženo bez zákazníka – údaje sedí i na zákazníka, kterého jsi v nabídce neviděl.'
        : 'Uloženo bez zákazníka – v evidenci je možná shoda, kterou jsi nevybral.')
      : r.jak === 'bez' && volbaNovy ? 'Zákazník se nezaložil – chybí jméno nebo platný telefon/e-mail.' : '';
    poUlozeni = text ? {id: r.id, text} : null;

    renderDetail(r.id);
  }).catch(e => $('#f-err').textContent = 'Uložení selhalo: ' + e.message);
}

      <label class="f" for="d-oznaceni">Označení kontaktu (nepovinné)</label>

const zaznamu = n => n === 1 ? 'záznam' : n >= 2 && n <= 4 ? 'záznamy' : 'záznamů';

function log(id, text){ return db.ref(`poptavky/${id}/historie`).push({t: TS(), kdo: user.email, text}); }

function zmenStav(id, stav){
  if (data[id].stav === stav) return;
  const upd = {stav, upraveno: TS()};
  if (stav === 'nabidka') upd.dalsiKontakt = dnes(3);           // po odeslání nabídky připomenout za 3 dny
  if (stav === 'prodano' || stav === 'ztraceno') upd.dalsiKontakt = null;
  db.ref('poptavky/' + id).update(upd);
  log(id, 'Stav → ' + STAVY[stav] + (upd.dalsiKontakt ? ' (další kontakt ' + fmtD(upd.dalsiKontakt) + ')' : ''));
}

function nastavKontakt(id, d){ db.ref('poptavky/' + id).update({dalsiKontakt: d || null, upraveno: TS()}); }

function pridejPozn(id){
  const t = $('#d-pozn').value.trim(); if (!t) return;
  $('#d-pozn').value = ''; $('#d-pozn').blur();
  log(id, t);
}

function smazat(id){
  if (confirm('Opravdu smazat poptávku ' + (data[id].jmeno || '') + '? Nejde to vrátit.')) smazatPotvrzeno(id);
}
function smazatPotvrzeno(id){ db.ref('poptavky/' + id).remove().then(renderHome); }   // v1.5: i z potvrzení v panelu „Další akce“

/* ===== Detail na mobilu (v1.5) – podle schváleného prototypu =====
   Nahoře kdo a co chce + Zavolat / Napsat, uprostřed „Po hovoru“ (poznámka → další kontakt → stav), sbalená historie.
   Méně časté akce (kontakt do iPhonu, úprava, smazání) v panelu „Další akce“. Ukládá stejné funkce jako detail na PC. */
const DNY = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
function hezkeDatum(iso){
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number), x = new Date(y, m - 1, d);
  const zaklad = `${DNY[x.getDay()]} ${d}. ${m}.` + (y !== new Date().getFullYear() ? ` ${y}` : '');
  return iso === dnes() ? 'dnes, ' + zaklad : iso === dnes(1) ? 'zítra, ' + zaklad : zaklad;
}
function terminMobil(p){
  if (!OTEVRENE.includes(p.stav)) return {txt: 'Uzavřeno', cls: ''};
  if (!p.dalsiKontakt) return {txt: 'Bez termínu', cls: ''};

/* v1.9: Souhlas GDPR – připraví SMS nebo e-mail s odkazem na formulář souhlasu Mercedes-Benz (bez předvyplnění,
   formulář údaje z odkazu nepřebírá). Odešle prodejce sám ve své aplikaci; do Poptávek se nic nezapisuje. */
const GDPR_ODKAZ = 'https://www.mercedes-benz.cz/passengercars/content-pool/marketing-pool/contact-forms/doc.html?d=2021-06-22&can=RetailWeb&cpid=doc_ms_7672&le=D-Outlet.9058&s=generic_landing_page';
const GDPR_PREDMET = 'Souhlas se zpracováním osobních údajů – Mercedes-Benz';
// Odkaz na samostatném řádku – Zprávy i pošta ho tak spolehlivě rozpoznají jako odkaz (v okně psaní bývá ještě černý, modrý je až po odeslání)
const GDPR_TEXT = `Dobrý den,\nposílám odkaz na souhlas se zpracováním osobních údajů pro Mercedes-Benz:\n\n${GDPR_ODKAZ}\n\nDěkuji, S. & W. Automobily`;
function gdprOdkazy(p, id){
  const tel = (p.telefon || '').replace(/[^\d+]/g, ''), e = t => encodeURIComponent(t).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase()), o = [];
  if (tel) o.push([`sms:${tel}?&body=${e(GDPR_TEXT)}`, '💬 Poslat SMS']);    // „?&body=“ funguje v iPhonu i Androidu
  if (p.email) o.push([gdprMailto(p, true), '✉️ Poslat e-mailem', `return gdprMail(event, '${id}')`]);

}
/* E-mail: mailto: umí jen prostý text a nový Outlook z něj odkaz neudělá. Proto se text s klikacím odkazem (HTML)
   zkopíruje do schránky a Outlook se otevře jen s příjemcem a předmětem – prodejce vloží text Ctrl+V.
   Když schránka nejde (starý prohlížeč, zakázaná oprávnění), otevře se e-mail s prostým textem jako dřív. */
const GDPR_HTML = `<p>Dobrý den,</p><p>posílám odkaz na <a href="${GDPR_ODKAZ.replace(/&/g, '&amp;')}">souhlas se zpracováním osobních údajů pro Mercedes-Benz</a>.</p>`
  + `<p>Děkuji,<br>S. &amp; W. Automobily</p>`;
function gdprMailto(p, sTextem){
  const e = t => encodeURIComponent(t).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
  return `mailto:${e(p.email.trim()).replace(/%40/g, '@')}?subject=${e(GDPR_PREDMET)}` + (sTextem ? `&body=${e(GDPR_TEXT)}` : '');

function gdprPrejdi(href){ location.href = href; }

      .then(() => { toast('📋 Text s odkazem je ve schránce – v e-mailu klikni do textu a dej Ctrl+V (na iPhonu podržet → Vložit).'); gdprPrejdi(gdprMailto(p, false)); },

/* ===== Známý zákazník (v1.2) =====
   Převzato z experimentu v0.5 ověřeného v emulátoru (repo Fenclotéka, experimenty/zakaznik_poptavka_v0.5).
   Rozhodnutí: zákazníka hledat automaticky, poptávku k němu přiřadit jen po klepnutí na Vybrat. Telefon nebo e-mail
   může mít víc lidí. Při nepotvrzené možné shodě se poptávka uloží bez zákazníka a nový zákazník nevznikne.
   „Je to nový zákazník“ založí nového i při podobném jménu nebo stejném telefonu – jen proti zákazníkům, které prodejce viděl.
   Vazba je jednosměrná: poptávka.zakaznik → /zakaznici/{key}. Starší poptávky zůstávají bez zákazníka. */
const TEL_RE = /^[0-9 +()\/-]+$/;              // stejné omezení jako pravidla /zakaznici/telefon
const EMAIL_RE = /^[^@ ]+@[^@ ]+\.[^@ ]+$/;    // stejné omezení jako pravidla /zakaznici/email

/* Normalizace – podmnožina matching.js z Fenclotéky (telefon bez předvolby +420, e-mail malými písmeny) */
const Norm = {
  phone(v){ return (v||'').toString().replace(/[\s\-().\/]/g,'').replace(/^00/,'+').replace(/^\+?420/,''); },
  phoneValid(v){ const s = this.phone(v); return (s && s.replace(/\D/g,'').length >= 6) ? s : null; },
  emailValid(v){
    const s = (v||'').toString().trim().toLowerCase().replace(/\s+/g,''), at = s.indexOf('@');
    if (at < 1 || s.indexOf('@', at + 1) !== -1) return null;
    const domain = s.slice(at + 1); return domain.indexOf('.') >= 1 ? s : null;
  }
};
/* Vyhledávací klíče; klíč v databázi nesmí obsahovat . # $ [ ] /, e-mail proto „.“ → „,“ */
function klicTelefonu(t){ const n = Norm.phoneValid(t); return n && /^\+?\d{6,15}$/.test(n) ? 'ph:' + n : null; }
function klicEmailu(e){ const n = Norm.emailValid(e); return n && !/[#$\[\]\/]/.test(n) ? 'em:' + n.replace(/\./g, ',') : null; }
function klicePro(telefon, email){
  const k = {}; const t = klicTelefonu(telefon), e = klicEmailu(email);
  if (t) k[t] = true; if (e) k[e] = true; return k;
}
/* Převzato z Fenclotéky (app.js, splitName): poslední slovo je příjmení */
function splitName(full){
  const parts = (full||'').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return {firstName:'', lastName:''};
  if (parts.length === 1) return {firstName:'', lastName:parts[0]};
  const lastName = parts.pop(); return {firstName:parts.join(' '), lastName};
}
/* Nový zákazník z údajů poptávky – jen pole, která pravidla povolí. Bez jména nebo bez platného telefonu/e-mailu → null. */
function zakaznikZPoptavky(v){
  const klice = klicePro(v.telefon, v.email), {firstName, lastName} = splitName(v.jmeno);
  const z = {zdroj:'poptavka', vytvoreno:TS(), upraveno:TS(), upravil:user.uid, klice};
  if (firstName && firstName.length <= 100) z.jmeno = firstName;
  if (lastName && lastName.length <= 100) z.prijmeni = lastName;
  if (!Object.keys(klice).length || (!z.jmeno && !z.prijmeni)) return null;
  if (v.telefon && v.telefon.length <= 30 && TEL_RE.test(v.telefon)) z.telefon = v.telefon;
  if (v.email && v.email.length <= 120 && EMAIL_RE.test(v.email)) z.email = v.email;
  return z;
}
/* Existující zákazník se shodným telefonem nebo e-mailem; krome = zákazníci, které prodejce viděl */
function najdiPodleKlicu(zakaznici, klice, krome = []){
  for (const [key, z] of Object.entries(zakaznici || {}))
    if (!krome.includes(key) && Object.keys(klice).some(k => z.klice && z.klice[k])) return key;
  return null;
}
function naKatalog(key, z){
  return {key, firstName:z.jmeno||'', lastName:z.prijmeni||'', company:z.firma||'', phone:z.telefon||'', email:z.email||''};
}
const celeJmeno = c => [c.firstName, c.lastName].filter(Boolean).join(' ') || c.company || '(bez jména)';

/* Vyhledání: telefon – shoda části čísla (aspoň 3 číslice); jméno – každé slovo bez diakritiky sedí na jméno, příjmení nebo firmu */
const bezDiakritiky = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function hledejZakaznika(jmeno, telefon){
  const qTel = Norm.phone(telefon || ''), telOk = qTel.replace(/\D/g,'').length >= 3;
  const slova = bezDiakritiky(jmeno).split(/\s+/).filter(Boolean), jmOk = slova.join('').length >= 3;
  const vysledky = [];
  for (const c of ZAKAZNICI) {
    const podleTel = telOk && Norm.phone(c.phone).includes(qTel);
    const pole = [c.firstName, c.lastName, c.company].map(bezDiakritiky);
    const podleJm = jmOk && slova.every(w => pole.some(x => x.includes(w)));
    if (podleTel || podleJm) vysledky.push({c, podleTel, podleJm});
  }
  vysledky.sort((a,b) => (b.podleTel - a.podleTel) || (a.c.lastName||'').localeCompare(b.c.lastName||'','cs'));
  return vysledky;
}

/* Poptávky zákazníka (dopočítané z /poptavky), nejnovější první */
function poptavkyZakaznika(key){
  return vsechny().filter(p => p.zakaznik === key).sort((a,b) => (b.vytvoreno||0) - (a.vytvoreno||0));

function radkyPoptavek(key){

}
function kartaZakaznika({c, podleTel}, akce){

/* Panel pod telefonem ve formuláři nové poptávky */
function prekresli(){

  }

      <div class="row"><button class="btn sec sm" onclick="zrusNovy()">Zrušit – ukázat podobné</button></div></div>`;
    return;
  }
  novy = null;                                          // vyhledávání ukazuje někoho dalšího → volbu potvrdit znovu
  if (!v.length) { box.innerHTML = ''; return; }        // nikdo podobný: formulář pokračuje jako ve v1.1
  const nadpis = v.length === 1 ? 'Známý zákazník?' : `Možní známí zákazníci (${v.length}) – vyber správného`;
  box.innerHTML = `<div class="panel"><b>${nadpis}</b>

    <div class="row"><button class="btn sec sm" onclick="jeNovy()">Je to nový zákazník</button></div>
    <div class="hint" style="margin-top:8px">Když nevybereš nic, poptávka se uloží bez přiřazení k zákazníkovi.</div></div>`;
}
/* Výběr: jméno se nahradí celým jménem, telefon a e-mail se doplní jen do prázdných polí */

/* Uložení nové poptávky jedním zápisem: poptávka (tvar v1.1 + zakaznik) a případně nový zákazník.
   Pořadí: 1) vybraný tlačítkem Vybrat, 1a) „Je to nový zákazník“ (jen proti viděným zákazníkům),
           2) možná shoda (stejný telefon/e-mail, nebo ji ukázalo vyhledávání) → BEZ zákazníka,
           3) žádná shoda → nový zákazník, 4) jinak bez zákazníka.
   Když /zakaznici nejde načíst, poptávka se uloží bez zákazníka jako ve v1.1. */
async function ulozPoptavku(v, pozn){
  const zakaznici = await db.ref('zakaznici').once('value').then(s => s.val() || {}, () => null);
  const upd = {}; let key = null, jak = 'bez';
  if (zakaznici) {
    const novyZ = zakaznikZPoptavky(v);
    if (vybrany && zakaznici[vybrany]) { key = vybrany; jak = 'vybrany'; }
    else {
      const shodaKlic = novyZ ? najdiPodleKlicu(zakaznici, novyZ.klice) : null;
      const nalezeni = hledejZakaznika(v.jmeno, v.telefon).map(x => x.c.key);
      if (novy && novyZ && nalezeni.every(k => novy.includes(k)) && !najdiPodleKlicu(zakaznici, novyZ.klice, novy))
        { key = db.ref('zakaznici').push().key; jak = 'novyPotvrzeny'; upd['zakaznici/' + key] = novyZ; }
      else if (novy) jak = novyZ ? 'neovereno' : 'bez';
      else if (shodaKlic || nalezeni.length) jak = 'neovereno';
      else if (novyZ) { key = db.ref('zakaznici').push().key; jak = 'novy'; upd['zakaznici/' + key] = novyZ; }
    }
  }
  const id = db.ref('poptavky').push().key;
  const zaznam = {...v, stav:'nova', vytvoreno: TS(), prodejce: user.email, historie: {}};
  if (key) zaznam.zakaznik = key;
  zaznam.historie[db.ref().push().key] = {t: TS(), kdo: user.email, text: 'Založeno (' + KANALY[v.kanal] + ')'};
  if (pozn) zaznam.historie[db.ref().push().key] = {t: TS(), kdo: user.email, text: pozn};
  upd['poptavky/' + id] = zaznam;
  await db.ref().update(upd);
  return {id, zakaznik: key, jak};
}

/* Detail poptávky: ke komu patří */
function zakaznikDetailu(p){
  if (!p.zakaznik) return '';
  const c = ZAKAZNICI.find(z => z.key === p.zakaznik); if (!c) return '';
  return `<div class="hint" style="margin-top:4px">👤 Zákazník: ${esc(celeJmeno(c))}${c.company ? ' (' + esc(c.company) + ')' : ''}</div>`;
}

/* ===== Kontakt do iPhonu (v1.4) =====
   Převzato z experimentu experimenty/vcard_v0.1 (ověřeno na skutečném iPhonu): vCard 3.0, UTF-8, řádky CRLF,
   escapování \ , ; a nových řádků, zalomení po 75 bajtech (nikdy uprostřed znaku). Jen ruční export po klepnutí,
   nic se nezapisuje do databáze ani do telefonu automaticky. iPhone skládá jméno z pole N, proto je označení i v příjmení. */
const vcEsc = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
const utf8Len = s => new TextEncoder().encode(s).length;
function zalom(radek){
  const casti = []; let akt = '';
  for (const ch of radek) {
    if (utf8Len(akt + ch) > 75) { casti.push(akt); akt = ' ' + ch; }
    else akt += ch;
  }
  casti.push(akt);
  return casti.join('\r\n');
}
/* Telefon do mezinárodního tvaru: 777 123 456 / 00420… → +420 777 123 456; jiné (zahraniční) tvary beze změny */
function telefonCZ(t){
  const c = String(t || '').replace(/[^\d+]/g, '');
  if (/^\d{9}$/.test(c)) return '+420 ' + c.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  if (/^(\+|00)420\d{9}$/.test(c)) return '+420 ' + c.slice(-9).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  return String(t || '').trim();
}
/* vCard z poptávky: jméno (+ volitelné označení), telefon, e-mail, poznámka = celé „Co chce“ */
function vCardZPoptavky(p, znacka, id){
  const jmeno = String(p.jmeno || '').trim(), oz = String(znacka || '').trim();
  const zaklad = jmeno || telefonCZ(p.telefon) || String(p.email || '').trim() || 'Zákazník z Poptávek';
  const {firstName, lastName} = jmeno ? splitName(jmeno) : {firstName: '', lastName: zaklad};
  const prijmeni = [lastName, oz].filter(Boolean).join(' · ');
  const radky = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vcEsc(prijmeni)};${vcEsc(firstName)};;;`, `FN:${vcEsc([zaklad, oz].filter(Boolean).join(' · '))}`];
  if (String(p.telefon || '').trim()) radky.push(`TEL;TYPE=CELL,VOICE:${vcEsc(telefonCZ(p.telefon))}`);
  if (String(p.email || '').trim()) radky.push(`EMAIL;TYPE=INTERNET:${vcEsc(String(p.email).trim())}`);
  if (String(p.zajem || '').trim()) radky.push(`NOTE:${vcEsc(p.zajem)}`);
  if (id) radky.push(`item1.URL;TYPE=pref:${odkazNaPoptavku(id)}`, 'item1.X-ABLabel:Poptávky');   // v1.6: popisek „Poptávky“ v Kontaktech
  radky.push('END:VCARD');
  return {vcf: radky.map(zalom).join('\r\n') + '\r\n',
          soubor: (bezDiakritiky([zaklad, oz].filter(Boolean).join(' ')).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'kontakt') + '.vcf'};
}
/* ===== Odkaz z kontaktu v iPhonu (v1.6) – ověřeno experimentem vcard_odkaz_v0.1 =====
   Kontakt nese odkaz na stálou adresu poptavky.html (přesměruje na aktuální verzi), aby staré kontakty otevíraly
   vždy nejnovější Poptávky. Odkaz obsahuje jen ID poptávky; údaje se ukážou až po přihlášení. Adresa je odvozená
   od místa, odkud appka běží (větev při testování, main po sloučení). */
const odkazNaPoptavku = id => new URL('poptavky.html', location.href).href + '#poptavka=' + encodeURIComponent(id);
function idZOdkazu(){
  const m = location.hash.match(/^#poptavka=([^&]+)$/); if (!m) return null;
  try { return decodeURIComponent(m[1]); } catch (e) { return ''; }   // poškozený odkaz → hláška na přehledu
}
let cekaOdkaz = idZOdkazu(), dataNactena = false, hlaskaPrehled = '';
function otevriOdkaz(){
  const id = cekaOdkaz; cekaOdkaz = null;
  history.replaceState(null, '', location.pathname + location.search);   // obnovení stránky už detail znovu neotevře
  if (id && data[id]) { renderDetail(id); return; }
  hlaskaPrehled = 'Poptávku z kontaktu jsem nenašel – možná byla smazaná.';
  renderHome();
}
window.addEventListener('hashchange', () => { cekaOdkaz = idZOdkazu(); if (cekaOdkaz !== null && dataNactena) otevriOdkaz(); });

/* Po klepnutí: soubor .vcf ke stažení (na iPhonu otevřít a „Vytvořit nový kontakt“) */
function ulozKontakt(id){
  const p = data[id]; if (!p) return;
  const {vcf, soubor} = vCardZPoptavky(p, oznaceni.id === id ? oznaceni.text : '', id);
  const url = URL.createObjectURL(new Blob([vcf], {type: 'text/vcard;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = soubor; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ===== Export ===== */
function exportCSV(){
  const q = v => '"' + String(v ?? '').replace(/"/g,'""').replace(/\r?\n/g,' ') + '"';
  const rows = [['Vytvořeno','Kanál','Jméno','Telefon','E-mail','Co chce','Stav','Další kontakt','Prodejce']];
  vsechny().sort((a,b) => (a.vytvoreno||0) - (b.vytvoreno||0)).forEach(p => rows.push([
    fmtTs(p.vytvoreno), (KANALY[p.kanal]||'').replace(/^\S+\s/,''), p.jmeno, p.telefon, p.email, p.zajem, STAVY[p.stav], fmtD(p.dalsiKontakt), p.prodejce]));
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'poptavky_' + dnes() + '.csv'; a.click();
}
